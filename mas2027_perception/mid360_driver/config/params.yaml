/**:
  ros__parameters:
    lidar_topic: /mid360_driver/lidar
    lidar_frame: lidar_link
    imu_topic: /mid360_driver/imu
    imu_frame: lidar_imu
    lidar_publish_time_interval: 0.05 # 雷达点云发布间隔，单位秒
    host_ip: 192.168.1.50 # 主机ip地址
    is_topic_name_with_lidar_ip: false # 是否在话题名后面加雷达ip，可以用于区分多个雷达
    front_lidar_ip: "192.168.1.136"
    front_lidar_frame: lidar_link
    back_lidar_ip: "192.168.1.193"
    back_lidar_frame: lidar_back_link
    enable_lidar_merge: true # 驱动内将两台雷达融合后发布到 lidar_topic
    merge_front_ip: "192.168.1.136" # 参考雷达，点坐标保持不变
    merge_back_ip: "192.168.1.193" # 此雷达点转换到参考雷达坐标系
    merge_extrinsic_back_to_front: [0.0, 0.200484459, -0.223172538, -1.677800, 0.0, 0.0] # 左→右：T_lidar_link^{-1}*T_lidar_back；手性对称 R=Rx(-2α)，α=0.8389；[x,y,z,roll,pitch,yaw]
    merge_max_interval_ms: 50.0 # 配对窗口，超限丢更旧的队头且不发半帧；有 PTP 收到 5.0
    # 单雷达降级：一台雷达掉线时用另一台继续发 /lidar，导航不断流（否则 /lidar 整段静默）。
    merge_stale_timeout_s: 0.5 # 某台雷达超过这么久没有点云就判为掉线，改用另一台单独发帧
    merge_recover_hold_s: 0.5 # 掉线雷达恢复后需连续在线这么久，才重新参与双雷达配对（防边界抖动）
    merge_imu_stale_timeout_s: 0.1 # 参考雷达 IMU 超过这么久没有数据就把 IMU 切到另一台（换算到参考雷达系）
    # 某台雷达静默超过这么久后允许重新锚定时间戳：水位线只在接受时前进，不重锚的话
    # 一次超过 max_packet_time_jump 的断线（或雷达重启后内部时钟归零）会让它永远恢复不了。
    packet_resync_silence: 1.0 # 单位秒，0 关闭重锚定
    validate_crc: true # 是否校验Livox数据包CRC32
    max_packet_time_jump: 0.5 # 单个雷达UDP包时间戳允许的最大跳变，单位秒
    max_packet_time_span: 0.1 # 单个雷达包/发布帧允许的最大点时间跨度，单位秒
    max_point_range: 300.0 # driver接受的最大点距离，单位米
    max_imu_acc: 100.0 # driver接受的最大IMU加速度模长
    max_imu_gyro: 100.0 # driver接受的最大IMU角速度模长
    min_drop_log_interval: 0.1 # 丢包日志最小打印间隔，单位秒，避免刷屏
