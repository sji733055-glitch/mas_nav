  depth: 1
  reliability: reliable
  durability: transient_local
/nav_executor/global_plan:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
/nav_executor/debug/minco_trajectory:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
/nav_executor/debug/global_plan:
