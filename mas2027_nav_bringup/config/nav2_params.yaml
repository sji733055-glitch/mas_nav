# Nav2 局部导航参数（不加载全局地图，全部在里程计坐标系下运行）
# 数据输入：
#   TF：odom -> base_link -> base_link_fake
#   里程计：/Odometry_world_fixed（fake_vel_transform 转发 /Odometry，twist 旋到 base_link_fake 轴系）
#   障碍物：局部图和全局图都用 /rog_map/terrain_map（rog_map ProjectionLayer 经
#           layer_value_to_cloud 桥接发布）。terrain_analysis / terrain_analysis_ext
#           已不再使用，两个节点默认不启动（use_terrain_analysis 默认 False）。
# 速度链路：
#   controller_server -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel_nav_smoothed
#   -> fake_vel_transform -> /cmd_vel -> ros2_comm -> 底盘
# 说明：Nav2 全程在 base_link_fake（yaw 固定在启动方向）中规划，
#       所以角速度、角加速度相关参数一律置零，车体自旋由 /cmd_spin 单独下发。

# 行为树导航器：加载行为树，调度规划、控制与恢复动作
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom                     # 无全局地图，导航参考系直接用里程计坐标系
    robot_base_frame: base_link_fake       # yaw 固定的机器人坐标系，让规划与车体朝向解耦
    odom_topic: /Odometry_world_fixed      # 速度反馈来源，twist 已旋到 base_link_fake 轴系
    transform_tolerance: 0.3               # TF 允许的最大滞后，单位秒
    bt_loop_duration: 10                   # 行为树 tick 周期，单位毫秒
    default_server_timeout: 20             # 行为树节点等待 action 服务响应的超时，单位毫秒
    wait_for_service_timeout: 1000         # 启动时等待各 server 服务上线的超时，单位毫秒
    # 单目标点导航行为树：失败时重规划并触发恢复行为
    default_nav_to_pose_bt_xml: $(find-pkg-share mas2027_nav_bringup)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    # 多目标点连续导航行为树：失败时重规划并触发恢复行为
    default_nav_through_poses_bt_xml: $(find-pkg-share mas2027_nav_bringup)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names:                                   # 行为树 XML 用到的节点插件库，缺项会导致行为树加载失败
      - nav2_compute_path_to_pose_action_bt_node        # 单点路径规划
      - nav2_compute_path_through_poses_action_bt_node  # 多点路径规划
      - nav2_follow_path_action_bt_node                 # 路径跟踪
      - nav2_back_up_action_bt_node                     # 后退恢复
      - nav2_wait_action_bt_node                        # 等待恢复
      - nav2_clear_costmap_service_bt_node              # 清空代价地图恢复
      - nav2_goal_updated_condition_bt_node             # 判断目标点是否被更新
      - nav2_rate_controller_bt_node                    # 限制子树执行频率
      - nav2_recovery_node_bt_node                      # 恢复行为循环控制
      - nav2_pipeline_sequence_bt_node                  # 流水线顺序执行
      - nav2_remove_passed_goals_action_bt_node         # 剔除已通过的目标点
      - nav2_navigate_to_pose_action_bt_node            # 单点导航入口
      - nav2_navigate_through_poses_action_bt_node      # 多点导航入口

# 行为树内部使用的 rclcpp 节点（承载 action 客户端）
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# 控制器服务：把全局路径转成速度指令，输出到 /cmd_vel_nav
controller_server:
  ros__parameters:
    use_sim_time: false
    # 必须用 /Odometry_world_fixed：Nav2 不变换 odom twist，直接当作 robot_base_frame(base_link_fake)
    # 中的当前速度。而 /Odometry 的 twist 在随车体转动的 base_link 中，两者相差一个车体 yaw，
    # 用错会把 DWB 的可达速度窗口锚在错误方向上，表现为速度越高横向跑偏越大。
    odom_topic: /Odometry_world_fixed
    # 控制周期，单位 Hz，需与局部代价地图更新率匹配。
    # 上游 navi_minco_bit 用 100.0，本仓库保留 DWB 时期已验证的 20.0：
    #   1) 与 FollowPath 的 dt: 0.05（MPC 时域步长）正好一致；
    #   2) /cmd_vel 最终经 ros2_comm 走 UDP 下发，100 Hz 会把发送量放大 5 倍，
    #      而 UDP 发送延迟才刚修好（commit 2d27c51）。
    # 若实测跟踪滞后再往上调，先确认下位机链路能吃下这个频率。
    controller_frequency: 20.0
    failure_tolerance: 0.5                 # 允许连续算不出有效速度的时长，单位秒，超时后判定失败
    min_x_velocity_threshold: 0.001        # 里程计 x 速度低于该值按 0 处理，滤除静止噪声
    min_y_velocity_threshold: 0.001        # 里程计 y 速度低于该值按 0 处理
    min_theta_velocity_threshold: 0.001    # 里程计角速度低于该值按 0 处理
    progress_checker_plugin: progress_checker    # 进度检查插件
    goal_checker_plugins: [general_goal_checker] # 到点判定插件
    controller_plugins: [FollowPath]             # 局部规划器插件

    # 进度检查：长时间原地不动则判定导航失败
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2        # 时间窗内至少要移动的距离，单位米
      movement_time_allowance: 10.0        # 允许位移不达标的时长，单位秒

    # 到点判定
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true                       # 位置达标后不再因抖动回退为未达标
      xy_goal_tolerance: 0.15              # 位置容差，单位米
      # base_link_fake 的 yaw 恒定，车体朝向由 /cmd_spin 控制，这里放开到 π 等价于忽略目标朝向
      yaw_goal_tolerance: 3.14159

    # 局部规划器 MINCO MPC（qpOASES 求解）。搬自 navi_minco_bit 的 sentry1.yaml。
    # 与 DWB 的区别：不再采样打分，而是跟踪 MincoPlanner 发布的时间参数化轨迹
    # （interfaces/msg/MpcPositionCommand），在 MPC 里解一个带速度/加速度约束的 QP。
    FollowPath:
      plugin: minco_controller::MincoMpcController
      dt: 0.05                             # MPC 离散步长，单位秒（上游取值）
      lookahead_time: 0.5                   # 预测时域时长，单位秒；horizon = lookahead_time / dt = 10 步
      use_small_gyro_mode: false            # true 时角速度锁定为 fixed_wz（小陀螺）；本车自旋走 /cmd_spin，保持 false
      deadzone_speed_threshold: 0.1        # 低于该合速度不下发，滤掉底盘死区内的抖动，单位 m/s
      control_delay_compensation: 0.05     # 控制链路延迟前馈补偿，单位秒
      # 代价权重：Q 对应状态误差 [x, y, yaw]，R 对应控制量误差 [vx, vy, omega]
      Q: [3.0, 3.0, 2.0]
      R: [1.5, 1.5, 1.0]
      # 速度上下限。与 MINCO max_velocity、velocity_smoother 一致。
      vx_min: -4.0
      vx_max: 4.0
      vy_min: -4.0
      vy_max: 4.0
      fixed_wz: 4.18                       # 仅 use_small_gyro_mode 为 true 时生效，单位 rad/s
      # base_link_fake 的 yaw 恒定、车体自旋由 /cmd_spin 单独下发，所以角速度自由度
      # 整体锁死为 0（等价于原 DWB 的 max_vel_theta / acc_lim_theta 置零）。
      # 上游是 ±5.0，那边的 MPC 要同时管朝向。
      omega_min: 0.0
      omega_max: 0.0
      # 加速度约束。与 velocity_smoother 的 max_accel 保持一致，填大了会解出执行不出来的速度。
      use_acc_constraints: true
      ax_min: -4.0
      ax_max: 4.0
      ay_min: -4.0
      ay_max: 4.0
      alpha_min: 0.0                       # 角加速度随 omega 一起锁零
      alpha_max: 0.0
      # 雷达安装偏置。与 planner 侧 lidar_offset_* 及 rog_map 的 center_offset
      # 是同一组标定量，本车未标定，一并置零（上游为 0.0 / -0.20 / 0.1745）。
      lidar_offset_x: 0.0
      lidar_offset_y: 0.0
      lidar_roll_offset: 0.0
      # 本仓库没有 map 帧，两项都填 odom（上游为 camera_init / map）
      odom_frame: odom
      map_frame: odom
      # MPC 状态反馈的里程计。上游把话题名硬编码成 /aft_mapped_to_init，本仓库改成了参数。
      # 必须是**未旋转**的 /Odometry（twist 在随车体转动的 base_link 里）：
      # 控制器内部 compensateLeverArm() 自己按 yaw 旋到全局系
      odom_topic: /Odometry_world_fixed
      # DWB 每周期发的 local_plan，MPC 版本由本仓库补上（上游没有这个话题）。
      # 下游 fake_vel_transform 用它判定控制器激活、并与 /Odometry 做近似时间同步，
      # 以取到与该速度同时刻的车体 yaw；RViz 的 "Local Plan" 显示也读它。
      # 用相对名，命名空间行为与 DWB 一致（空 namespace 下即 /local_plan）。
      local_plan_topic: local_plan
      #
      # === 输出速度的坐标系 ===
      # computeVelocityCommands() 返回的 twist 表达在 global_frame(odom) 轴系。
      # 这与 Nav2「twist 在 robot_base_frame 轴系」的约定并不矛盾：
      # fake_vel_transform 以 Rz(-yaw_chassis) 发布 base_link -> base_link_fake，
      # 所以 base_link_fake 相对 odom 的 yaw 恒为 0，两个轴系严格重合。
      # 最终旋到云台/底盘系（base_link）的是链路末端的 fake_vel_transform：
      #   controller_server -> /cmd_vel_nav -> velocity_smoother
      #   -> /cmd_vel_nav_smoothed -> fake_vel_transform（Rz(-yaw_chassis) 并叠加
      #   /cmd_spin 的自旋）-> /cmd_vel -> ros2_comm -> 下位机
      # 与换插件之前完全一致。所以这里绝不能再自行旋转一次，否则双重旋转。
      # 改 robot_base_frame 或去掉 fake_vel_transform 都会打破这个前提，
      # 插件在 configure 时会把两个坐标系名打进日志，现场可以直接核对。
      performance:
        enable: true
        print_enable: false                # 上游为 true，会每秒打一行；本仓库默认关掉少刷日志
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        mpc_csv_path: /tmp/mpc_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""

# 局部代价地图：供控制器做局部避障，随车滚动
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0               # 地图更新频率，单位 Hz
      publish_frequency: 5.0               # 可视化发布频率，单位 Hz
      global_frame: odom
      robot_base_frame: base_link_fake
      transform_tolerance: 0.3             # TF 允许的最大滞后，单位秒
      rolling_window: true                 # 地图随机器人滚动，无全局地图时必须为 true
      width: 10                            # 地图宽度，单位米
      height: 10                           # 地图高度，单位米
      resolution: 0.10                     # 栅格分辨率，单位米
      footprint: "[[-0.30, -0.30], [-0.30, 0.30], [0.30, 0.30], [0.30, -0.30]]"  # 0.6×0.6 m 方形轮廓
      footprint_padding: 0.02              # 轮廓外扩量，单位米
      track_unknown_space: false           # 未知区域按空闲处理，允许穿越无观测区域
      plugins: [intensity_voxel_layer, inflation_layer]
      # 地形点云 -> 三维体素 -> 二维代价，带强度筛选
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        footprint_clearing_enabled: true   # 清除车体轮廓内的障碍，避免自锁
        publish_voxel_map: false           # 是否发布体素地图，调试用，较占带宽
        combination_method: 1              # 与其他层合并方式：0 覆盖，1 取最大，2 取最大但不覆盖未知
        mark_threshold: 0                  # 一列中标记为障碍所需的最少体素数，0 表示有点即标记
        origin_z: 0.0                      # 体素网格底面高度，单位米，相对 odom 原点（启动时的 base_link）
        z_resolution: 0.05                 # 体素高度分辨率，单位米
        z_voxels: 16                       # 体素层数，与上两项共同覆盖 0.0 ~ 0.8 m
        unknown_threshold: 15              # 一列中未知体素超过该数则整列视为未知
        min_obstacle_height: 0.0           # 参与标记的点云最低高度，单位米，低于 odom 原点的点（含地面）直接丢弃
        max_obstacle_height: 2.0           # 参与标记的点云最高高度，单位米
        min_obstacle_intensity: 0.1        # 地形点强度下限，强度代表地形高差代价，调大可放过缓坡
        max_obstacle_intensity: 2.0        # 地形点强度上限，超出视为噪点忽略
        observation_sources: terrain_map
        terrain_map:
          # ROG-Map 的 ProjectionLayer 分类结果，经 layer_value_to_cloud 桥接节点
          # 从 /rog_map/layer_value 转成点云。取代原来 terrain_analysis 的
          # /terrain_map：地面/缓坡由 ProjectionLayer 判为 PASSABLE 而不进这里，
          # 避免雷达倾斜导致远方地面被当成障碍。
          # 依赖：use_rog_map:=True，且 rog_map 的 visualization.enable: True。
          # 回退到 terrain_analysis：本层和 global_costmap 的 topic 改回
          # /terrain_map 和 /terrain_map_ext，并且启动时加
          # use_terrain_analysis:=True use_terrain_analysis_near:=True
          # （两个开关现在默认 False，terrain 节点默认不启动）。
          topic: /rog_map/terrain_map
          data_type: PointCloud2
          sensor_frame: lidar_link         # 必填：点云 frame 是 odom，不填则距离过滤以 odom 原点为中心而非雷达
          marking: true                    # 用该点云标记障碍
          clearing: false                  # 不做射线清除，地形图自身已带时间衰减
          observation_persistence: 0.2     # 观测保留时长，单位秒，0 表示只用最新一帧
          expected_update_rate: 0.0        # 0 表示不检查话题超时
          obstacle_min_range: 0.2          # 参与标记的最小距离，单位米，滤掉车体附近点
          obstacle_max_range: 8.0          # 参与标记的最大距离，单位米，略大于地图半边长
          min_obstacle_height: 0.0         # 该观测源的高度下限，单位米
          max_obstacle_height: 2.0         # 该观测源的高度上限，单位米
      # 障碍膨胀：在障碍周围生成代价梯度
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.2             # 膨胀半径，单位米，略大于车体内切半径 0.30
        cost_scaling_factor: 4.0           # 代价指数衰减系数，越大代价降得越快、越敢贴近障碍
      always_send_full_costmap: true       # 每次发布完整地图而非增量，方便 RViz 显示

# 全局代价地图：供 planner 规划整条路径，同样滚动、范围更大、更新更慢
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0                # 地图更新频率，单位 Hz，与 planner 频率对齐
      publish_frequency: 1.0               # 可视化发布频率，单位 Hz
      global_frame: odom
      robot_base_frame: base_link_fake
      transform_tolerance: 0.3             # TF 允许的最大滞后，单位秒
      rolling_window: true                 # 无先验地图，全局层也随车滚动
      width: 30                            # 地图宽度，单位米，决定可规划的最远目标距离
      height: 30                           # 地图高度，单位米
      resolution: 0.10                     # 栅格分辨率，单位米
      footprint: "[[-0.30, -0.30], [-0.30, 0.30], [0.30, 0.30], [0.30, -0.30]]"  # 0.6×0.6 m 方形轮廓
      footprint_padding: 0.02              # 轮廓外扩量，单位米
      track_unknown_space: false           # 未知区域按空闲处理，配合 allow_unknown 允许向未探索区规划
      plugins: [intensity_voxel_layer, inflation_layer]
      # 参数含义同局部层，仅作用范围和衰减时间不同
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        footprint_clearing_enabled: true   # 清除车体轮廓内的障碍，避免自锁
        publish_voxel_map: false           # 是否发布体素地图，调试用
        combination_method: 1              # 与其他层合并方式：0 覆盖，1 取最大，2 取最大但不覆盖未知
        mark_threshold: 0                  # 一列中标记为障碍所需的最少体素数
        origin_z: 0.0                      # 体素网格底面高度，单位米，相对 odom 原点
        z_resolution: 0.05                 # 体素高度分辨率，单位米
        z_voxels: 16                       # 体素层数，覆盖 0.0 ~ 0.8 m
        unknown_threshold: 15              # 一列中未知体素超过该数则整列视为未知
        min_obstacle_height: 0.0           # 参与标记的点云最低高度，单位米，低于 odom 原点的点（含地面）直接丢弃
        max_obstacle_height: 2.0           # 参与标记的点云最高高度，单位米
        min_obstacle_intensity: 0.1        # 地形点强度下限
        max_obstacle_intensity: 2.0        # 地形点强度上限
        observation_sources: terrain_map
        terrain_map:
          # 与 local_costmap 用同一个 rog_map 源，terrain_analysis_ext 已不再使用。
          # NOTE: 观测范围由 rog_map 的 map_size [10, 10] 决定，即车体 ±5 m
          # （对角约 7.1 m），远小于本层 30x30 m 的地图范围。地图外圈拿不到观测，
          # 在 track_unknown_space: false 下按空闲处理，靠 allow_unknown 规划，
          # 车开近了才会看到障碍。要扩大全局感知范围只能调大 rog_map 的
          # map_size（代价：projection 栅格数按面积平方增长）。
          topic: /rog_map/terrain_map
          data_type: PointCloud2
          sensor_frame: lidar_link         # 必填：点云 frame 是 odom，不填则距离过滤以 odom 原点为中心而非雷达
          marking: true                    # 用该点云标记障碍
          clearing: false                  # 不做射线清除
          observation_persistence: 0.5     # 观测保留时长，单位秒，比局部层更长以稳定全局路径
          expected_update_rate: 0.0        # 0 表示不检查话题超时
          obstacle_min_range: 0.1          # 参与标记的最小距离，单位米
          obstacle_max_range: 25.0         # 参与标记的最大距离，单位米，大于 rog_map 实际可达范围，不构成额外裁剪
          min_obstacle_height: -0.2         # 该观测源的高度下限，单位米
          max_obstacle_height: 2.0         # 该观测源的高度上限，单位米
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.20             # 膨胀半径，单位米，小于车体内切半径 0.30，全局路径会贴近障碍，靠局部层兜底
        cost_scaling_factor: 4.0           # 代价指数衰减系数
      always_send_full_costmap: true       # 每次发布完整地图而非增量

# 全局规划器：MINCO。搬自 navi_minco_bit 的 sentry1.yaml planner_server 段。
# 与 NavFn 的本质区别：MincoPlanner 自己持有一份 ROG-Map（下面的 rog_map 段），
# 在 Signed ESDF 上做搜索和轨迹优化，不读 global_costmap。所以 global_costmap
# 只剩恢复行为和碰撞检查在用。
# rog_map 实例归 planner_server 进程所有，通过 rog_map::MapRegistry 供插件内部取用；
# 它发布的 /rog_map/layer_value 是绝对话题名，layer_value_to_cloud 桥接节点照旧能订阅，
# 所以整条链路只跑一份 rog_map，配置就是下面的 MincoPlanner.rog_map 段，别处没有第二份
# （原先给独立节点用的 config/rog_map_params.yaml 与 use_rog_map_standalone 开关已删除）。
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0       # 上游取值。MINCO 在 ESDF 上重规划，比 NavFn 快得多
    planner_plugins: [MincoPlanner]
    MincoPlanner:
      plugin: minco_planner/MincoPlanner
      # 上游用 PRIORMAP（需要 map 坐标系 + 先验 PGM，由 icp_relocalization 提供）。
      # 本仓库没有 map 帧也没有先验图，只能用 EXPLORATION：完全依赖在线 ROG-Map。
      planner_mode: PRIORMAP
      frames:
        # 本仓库全程在 odom 下运行，没有 map 帧，两项都填 odom。
        map_frame: odom
        rog_frame: odom
      priormap:
        # planner_mode: EXPLORATION 下不生效，保留上游取值便于以后切 PRIORMAP。
        use_nav2_global_search: true
        clip_seed_by_rog_boundary: true
        rog_boundary_margin: 0.2
        rog_boundary_sample_step: 0.1
      exploration:
        boundary_margin: 0.2               # 目标点被裁到 ROG-Map 边界内时留的余量，单位米
        boundary_sample_step: 0.1          # 沿边界找可行替代目标的采样步长，单位米
        unknown_as_occupied: true          # 探索模式下未知区域按障碍处理，避免往没看过的地方冲
        prefer_goal_direction: true        # 目标不可达时，优先取朝目标方向的边界点
      tolerance: 0.3                       # 目标点不可达时允许的替代终点半径，单位米
      use_smac: true                       # 用内置 SMAC 2D 搜索出初值，再交给 MINCO 优化
      allow_unknown: false                 # 搜索不穿未知区域（与 exploration.unknown_as_occupied 一致）
      odom_topic: /Odometry                # 上游是 /aft_mapped_to_init
      # 雷达安装偏置。与 rog_map 的 map_sliding.center_offset 是一对标定量，
      # 本车未标定，两处一起置零（上游为 0.0 / -0.20）。
      lidar_offset_x: 0.0
      lidar_offset_y: 0.0
      performance:
        enable: false
        print_enable: true
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""

      # === 以下 corridor / smac_2d / minco_optimizer / recovery_server 四段 ===
      # 原先整段缺失，全部走 minco_planner.cpp 的代码默认值。取值以上游
      # navi_minco_bit 的 params/sentry1.yaml 为基准，只改本车必须不同的项，
      # 每处偏离都在注释里写了原因。

      # 安全走廊的车体尺寸。上游是 0.25 / 0.05（那台车更小）。
      # 本车 footprint 0.6x0.6 m，内切半径 0.30，故 robot_radius 取 0.30，
      # extra_margin 沿用上游 0.05，合计裕度 0.35 m。
      # 代码默认是 0.4 + 0.15 = 0.55 m，比车体实际需要多 0.2 m，
      # 在 10x10 m 的局部图里会把很多本可通行的缝隙判成走不了。
      corridor:
        robot_radius: 0.30
        extra_margin: 0.05

      # SMAC 2D 初值搜索。代码默认 use_esdf_cost 为 false，即初值只看栅格占据、
      # 不看距离场，搜出来的折线会贴着障碍走，后面 MINCO 要多花迭代把它推开，
      # 也更容易被 validateTrajectory 拒掉。打开后按 ESDF 距离叠加
      # esdf_weight * exp(-dist / esdf_decay) 的代价，上限 esdf_max_cost。
      # 四项取值与上游一致。
      smac_2d:
        use_esdf_cost: true
        esdf_weight: 1.0
        esdf_decay: 0.8
        esdf_max_cost: 0.5

      minco_optimizer:
        opt_freq: 20.0                      # 重优化频率，单位 Hz，与 FSM 定时器一致
        lookahead_dist: 6.0                 # 沿全局路径截取多长一段交给 MINCO 优化，单位米（上游取值）
        traj_goal_tolerance: 0.3            # 轨迹终点与目标的允许偏差，单位米
        # 偏航优化。本车 base_link_fake 的 yaw 恒为 0、车体自旋走 /cmd_spin，
        # MPC 的 omega 又锁死在 [0, 0]，所以这里解出的 yaw 只会作为参考 yaw
        # 进入 MPC 的 Q[2]=2.0 代价项，却没有可用的控制量去跟踪它。
        # 这里先保持代码默认的 true（等于不改变现有行为），是否应该关掉待实测确认。
        enable_yaw_opt: true
        max_yaw_dot: 5.0                    # 偏航角速度上限，单位 rad/s（上游取值）

        # safe_dist 是优化器的软目标净空，collision_dist 是 validateTrajectory 的硬判据。
        # 必须 collision_dist < safe_dist：优化器只能渐近逼近 safe_dist，两者相等时
        # （代码里 collision_dist 缺省就取 safe_dist）会出现「Pos 惩罚为 0 但
        # validateTrajectory 判定碰撞」的自相矛盾拒绝，日志里已经能看到这种样本。
        # 上游是 0.35 / 0.25，留 0.10 m 松弛；本车内切半径 0.30，按同样关系取 0.40 / 0.30。
        safe_dist: 0.40
        collision_dist: 0.30

        # 必须与执行侧限幅一致。MincoMpcController 的 vx/vy 以及
        # velocity_smoother 的 max_velocity 同改成 3.0。
        # 三层不一致时 MPC 会一直落后。
        max_velocity: 4.0
        max_acceleration: 4.0

        turn_angle_deadzone: 0.1            # 转向角死区，单位弧度（上游取值，代码默认 0.174）
        turn_angle_saturation: 1.0          # 转向角饱和值，单位弧度（上游取值，代码默认 1.57）
        min_turn_vel: 0.8                   # 转弯时的最低保持速度，单位 m/s（上游取值）
        decay_power: 1.3                    # 转弯降速的衰减指数（上游取值，代码默认 2.0）

        time_allocation_iters: 15           # 时间分配的迭代次数（上游取值，与代码默认一致）
        smooth_eps: 0.01                    # 光滑化 max 函数的 epsilon（上游取值，与代码默认一致）
        integral_res: 16                    # 惩罚项沿轨迹的积分采样数（上游取值，与代码默认一致）
        opt_accuracy: 0.001                 # L-BFGS 收敛阈值（上游取值，代码默认 1.0e-4 更严、更慢）
        # 代码默认是 true，就是日志里每次优化都刷一整块 "[MincoOpt] Opt finish" 的来源。
        # 上游关掉了；本仓库同样关掉，需要看优化过程时再临时打开。
        # TODO 临时打开中：查 validateTrajectory 一直报 |a| 超限的原因。看 iter num
        # 是不是只有三四次（L-BFGS 的 delta 判据是相对的，cost 大时会提前收敛退出），
        # 以及 Pos/Vel/Acc/Time 哪一项撑起了 cost 的地板。查完改回 false。
        print_optimizer_log: true

        # === 惩罚权重 ===
        # penalty_weight_time 是全局时间惩罚（代码里对应 minco_config.rho）。
        # 代码默认 0.01，几乎不惩罚轨迹时长，结果 0.95 m 的目标被优化成 5 s
        # （平均 0.19 m/s），MPC 在 0.5 s 预测时域内取到的参考速度全部落在
        # deadzone_speed_threshold 以下。上游取 100.0，相差 1 万倍。
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0         # 位置（净空）惩罚，代码默认 1000.0，上游 50000.0
        penalty_weight_vel: 1500.0          # 速度越界惩罚，代码默认 1000.0
        penalty_weight_acc: 1500.0          # 加速度越界惩罚，代码默认 10000.0（偏大，会压住加速）
        penalty_weight_att: 100.0           # 吸引项惩罚，代码默认 1000.0
        penalty_weight_time_barrier: 50.0   # 时间下界障碍项，代码默认 100.0

      # 规划器内部的恢复状态机，与 Nav2 behavior_server 的 backup/wait 是两套东西。
      # 四项取值与上游一致（代码默认 3 / 2.0 / 3.0 / 0.4）。
      recovery_server:
        fail_threshold: 5                   # 连续失败多少次进入恢复
        cooldown_sec: 1.0                   # 两次恢复之间的冷却时长，单位秒
        recovery_window_sec: 3.0            # 统计失败次数的滑动窗口，单位秒
        escape_speed: 0.5                   # 脱困速度，单位 m/s

      # ROG-Map 配置。**这是全仓库唯一一份 ROG-Map 参数**，改参数就改这里。
      # 取值搬自上游 navi_minco_bit 的 sentry1.yaml，其中 frame_id、visualization.frame_id、
      # ros_callback.odom_topic、ros_callback.cloud_topic 四项按本仓库链路改过，
      # 别在同步上游时覆盖回去。
      rog_map:
        frame_id: odom
        resolution: 0.05
        # [基础地图][m/cell] 三维膨胀地图分辨率；通常与 resolution 保持一致，过细增加膨胀查询计算量，过粗会让碰撞边界变粗糙。
        inflation_resolution: 0.05
        map_size: [10.0, 10.0, 1.5]
        fix_map_origin: [0.0, 0.0, 0.0]

        map_sliding:
          enable: true
          # [map_sliding][m] 触发地图滑动的位移阈值；过小会频繁滑动并带来计算抖动，过大可能让机器人靠近局部地图边缘。
          threshold: 0.2
          center_offset_enable: false
          center_offset: [0.0, 0.0, 0.0]

        ros_callback:
          enable: true
          # 吃 small_point_lio 的稠密去畸变点云；订阅端已是 SensorDataQoS().keep_last(1)，
          # 发布端同为 keep_last(1)，高负载时直接丢旧帧而不是排队攒延迟。
          cloud_topic: /cloud_registered
          odom_topic: /Odometry
          odom_timeout: 0.08
          update_period_ms: 20

        raycasting:
          enable: true
          # [raycasting][帧] 每批处理点云帧数；调大可攒批减少调度开销，但会增加地图更新延迟。
          batch_update_size: 1
          # [raycasting][m,m] 射线有效距离 [min,max]；min 过大会忽略近处点，max 过大会增加计算量并可能引入远处噪声。
          ray_range: [0.01, 8.0]
          # [raycasting][m,m,m] 每次局部更新盒尺寸；调大覆盖更多点但 raycasting 和 dirty column 数量上升。
          local_update_box: [10.0, 10.0, 2.5]
          # [raycasting][概率] unknown 判断阈值相关参数；影响 UNKNOWN/FREE/OCCUPIED 判定，进而影响 projection layer。
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          # [raycasting/performance][bool] raycast 并行开关；会被 performance.parallel_raycast_enable 后加载覆盖，影响 CPU 占用和更新延迟。
          parallel_enable: false
          # [raycasting/performance][线程] raycast 线程数；不宜超过可用 CPU 核数，过大可能因竞争导致抖动。
          num_threads: 4

        decay:
          enable: true
          # [decay][s] 最后一次 hit 后保持 occupied 的最小时间；过短障碍闪烁，过长动态障碍残留。
          keep_time: 0.8
          # [decay][s] 最后一次 hit 后强制衰减到 free 的最大时间；必须大于 keep_time。
          clear_time: 1.2
          # [decay][bool] 只维护活跃 cell 衰减列表；开启通常降低计算量，若列表维护异常会影响动态清除完整性。
          active_list_enable: false

        projection:
          enable: true

          # 标准 Nav2 YAML/PGM 静态先验；启用后只增加二维硬障碍，不清除在线障碍。
          prior_map:
            # 之前为了「只用先验图的 ESDF 测 MPC」把 enable 开成 true、frame_id 改成 odom，
            # 那是临时实验配置，跑真车必须关回来。原因：rmuc.pgm 的 origin 是
            # (-7.76, -5.97)，坐标定义在 map 系里；写成 odom 就等于把整张赛场按 odom 原点
            # （车开机的地方）贴上去，实测 odom 原点周围 1 m 内有 296/1681 个格子是墙。
            # 真要用先验图，得先起 map_server 并有 map->odom 的 TF，frame_id 保持 map。
            enable: true
            yaml_path: "/home/ros2_ws/src/mas2027_nav_bringup/map/lab3.yaml"
            # 留空时使用 YAML 的 image 字段，并相对 YAML 所在目录解析。
            pgm_path: "/home/ros2_ws/src/mas2027_nav_bringup/map/lab3.pgm"
            frame_id: map

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 下界。
          # 这是坐标值，不是地面相对高度，也不是高度差。
          scan_z_min_abs: -1.2

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 上界。
          # 这是坐标值，不是障碍高度，也不是高度差。
          scan_z_max_abs: 1.5

          # UNKNOWN 是否作为 ESDF 障碍。
          unknown_as_occupied: false

          # 每个 XY 柱中 KNOWN_FREE + OCCUPIED 的最小观测体素数。
          min_observed_voxels: 1

          # [vertical height difference, m]
          # 同一 XY 柱中最高与最低占据体素的垂直高度差 H。
          # 不超过该值时，分类为地面或坡面薄表面。
          # 这是差值，不是 ROGMap frame 中的绝对 Z 坐标。
          surface_height_delta_max: 0.1

          # [vertical height difference, m]
          # 判定竖直墙所需的最小单柱垂直高度差 H。
          # 这是差值，不是绝对 Z 坐标。
          wall_height_delta_min: 0.40

          # [dimensionless ratio, 0~1]
          # H 区间内的垂直占据率达到该值时，视为连续竖直墙。
          wall_occupancy_ratio_min: 0.80

          # [vertical height difference, m]
          # 可通行隧道所需的最小上下表面高度差。
          # 应包含机器人实际高度和安全余量。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_min: 0.25

          # [vertical height difference, m]
          # 当前 RM 场景中允许识别为目标隧道的最大上下表面高度差。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_max: 0.40

          # [dimensionless ratio, 0~1]
          # 隧道上下表面之间的最大垂直占据率。
          tunnel_occupancy_ratio_max: 0.45

          # PASSABLE 在 value layer 中的代价值。
          passable_cost: 50

          # PASSABLE 是否在 value layer 中写为 FREE。
          # PASSABLE 的 ESDF mask 始终为 1。
          passable_as_free: true

          hysteresis_enable: false
          hysteresis_count: 2
          # Projection 二维障碍退出原始 OCCUPIED 后的保持时间，单位为秒。
          obstacle_hold_time: 1.5

          mask_filter_en: true
          fill_occ_min: 4
          denoise_occ_max: 0
        field:
          enable: true
          # [field][m] ESDF 整体外扩：field_layer.cpp:99 是 inflated = raw - inflation_radius，
          # 也就是每个格子的距离直接减掉这个数。MINCO 的 Pos 惩罚用 safe_dist 0.40 判净空，
          # 所以这里填 R 等于要求离障碍 0.40+R 米。填 0.5 时要求 0.9 m，而车内切半径只有 0.30，
          # 近处有障碍时整条轨迹处处违反净空 → Pos 惩罚变成搬不动的常数（cost 地板 1e4~5e4）
          # → L-BFGS 的相对收敛判据（|Δf|/|f| < opt_accuracy）立刻满足 → 三次迭代就退出、
          # 返回没优化过的初始猜测 → validateTrajectory 报 |a| 超限。别再填非零值。
          inflation_radius: 0.0
          # [field][m] ESDF 正向最大截断距离；调大提供更远梯度但代价有限，过小会让远离障碍区域梯度变少。
          max_distance: 6.0
          # [field][m] ESDF 负向最小截断距离；控制障碍内部负距离下限，影响优化代价范围。
          min_distance: -3.0
          clamp_distance: true
          # [field][枚举] 插值方式 bilinear/quadratic；quadratic 梯度更平滑，边界邻域不足时会回退到 bilinear。
          interpolation: quadratic
          update_rate: 20.0

        performance:
          enable: true
          # NOTE: 下面两个 CSV 开关和 print_enable 是为了定位
          # " -- [ROG WARN] Unfinished frame cnt > 1" 临时打开的，用于量出单帧更新里
          # raycast / prob_update / decay / projection / field / snapshot 各占多少毫秒。
          # detailed 每帧写一行，量完请改回 false，不要长期开着跑比赛。
          detailed_csv_enable: true
          summary_csv_enable: true
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          # [performance][string] 实验场景名。
          scenario: ""
          # [performance][string] 实验变体名。
          variant: ""
          # [performance][行] CSV flush 间隔；避免每行强制 flush 变成新瓶颈，节点退出时仍会关闭文件。
          csv_flush_every_n: 30
          print_enable: false
          # [performance][Hz] 性能摘要和 summary CSV 频率。
          summary_rate: 1.0
          # [performance][bool] 是否启用 dirty column 增量刷新；开启可减少 projection/field 全量刷新计算量。
          # 定位实时性问题时可以临时置 false 做 A/B，看增量刷新是否真的生效。
          # 置 false 时 refreshLayers() 每帧全量扫 40401 列 x 34 个 z 层 ≈ 1.37M 次体素
          # 查询，实测 projection_time 稳定在 11~17 ms；跑车时保持 true。
          dirty_column_enable: true
          # [performance][比例] dirty column 超过地图总列数比例时转全量刷新；调低更常全量，调高更依赖增量更新。
          dirty_full_ratio: 0.30
          # [performance/raycasting][bool] 并行 raycast 开关；代码后加载该值，会覆盖 raycasting.parallel_enable。
          parallel_raycast_enable: false
          raycast_num_threads: 4

        visualization:
          # [visualization][bool] 总开关；false 时不创建可视化 timer，不发布任何可视化 topic。
          enable: true
          frame_id: odom
          # [visualization][Hz] 可视化发布上限频率；实际每个 topic 仅在存在订阅者时构造并发布。
          rate: 10.0
          range: [10.0, 10.0, 1.5]

# 路径平滑服务：对规划出的折线做平滑，行为树中可选调用
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10                   # 迭代收敛阈值，越小越平滑但耗时更长
      max_its: 1000                        # 最大迭代次数
      do_refinement: true                  # 收敛后再做一轮精修

# 恢复行为服务：导航卡住时执行，只启用后退和等待（自旋由 /cmd_spin 负责，不在此处）
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw            # 恢复动作做碰撞检查用的代价地图
    footprint_topic: local_costmap/published_footprint  # 碰撞检查用的车体轮廓
    cycle_frequency: 10.0                  # 恢复行为执行频率，单位 Hz
    behavior_plugins: [backup, wait]
    backup:
      plugin: nav2_behaviors/BackUp        # 沿 -x 后退一段距离
    wait:
      plugin: nav2_behaviors/Wait          # 原地等待，等动态障碍离开
    global_frame: odom
    robot_base_frame: base_link_fake
    transform_tolerance: 0.3               # TF 允许的最大滞后，单位秒
    simulate_ahead_time: 2.0               # 恢复动作前向碰撞检查时长，单位秒

# 航点跟随：按顺序把多个目标点交给 bt_navigator
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20                          # 状态轮询频率，单位 Hz
    stop_on_failure: false                 # 单个航点失败后继续跑后面的航点
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200         # 到达每个航点后的停留时长，单位毫秒

# 速度平滑器：/cmd_vel_nav -> /cmd_vel_nav_smoothed，限加速度并做超时保护
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0              # 输出频率，单位 Hz，与 controller_frequency 一致
    scale_velocities: true                 # 超限时等比缩放各轴，逐轴裁剪会改变速度方向、导致跑偏
    feedback: OPEN_LOOP                    # 以上一次输出作为当前速度，不依赖里程计反馈
    max_velocity: [4.0, 4.0, 0.0]          # [x, y, theta] 输出速度上限，与 MINCO / MPC 一致
    min_velocity: [-4.0, -4.0, 0.0]        # [x, y, theta] 输出速度下限
    max_accel: [4.0, 4.0, 0.0]             # [x, y, theta] 加速度上限，单位 m/s²、rad/s²
    max_decel: [-4.0, -4.0, 0.0]           # [x, y, theta] 减速度上限（负值）
    odom_topic: /Odometry_world_fixed      # 仅 CLOSED_LOOP 模式使用；与控制器同源，twist 在 base_link_fake 轴系
    odom_duration: 0.1                     # 里程计反馈缓存时长，单位秒，仅 CLOSED_LOOP 使用
    deadband_velocity: [0.0, 0.0, 0.0]     # 输出死区，低于该值直接归零，用于抑制底盘抖动
    velocity_timeout: 0.5                  # 超过该时间未收到新指令则输出零速，单位秒

