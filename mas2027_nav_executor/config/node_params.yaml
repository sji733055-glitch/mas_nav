/**:
  ros__parameters:
    node:
      # prior requires static terrain; online uses only live ROGMap in odom.
      # The launch reads this value to select the complete startup profile; restart to change.
      map_source: online
      control_rate_hz: 20.0
      planner_frequency: 20.0
      trajectory_timeout_s: 0.6
      odom_timeout_s: 0.5
      # 硬净空统一取 planner.minco_optimizer.collision_dist，node 不再单独配置一份。
      # ROGMap 最后一次完成点云地图更新的最大年龄。点云断流或地图工作线程停滞时
      # 目标接纳和速度指令 fail closed；这直接读 ROGMap 快照时戳，不依赖任何 ROS 心跳话题。
      rog_map_timeout_s: 0.5
      # The session terrain map retains observed special regions after the
      # rolling sensor window has moved away.
      online_terrain_label_timeout_s: 0.8
      output_in_body_frame: true
      frames:
        odom: odom
      topics:
        goal_sub: /goal_pose
        odom_sub: /Odometry
        trajectory_sub: /opt_path
        spin_cmd_sub: /cmd_spin
        # MINCO 局部优化轨迹的 Path 可视化；全局搜索折线使用 global_plan_pub。
        minco_path_pub: /nav_executor/minco_path
        global_plan_pub: /nav_executor/global_plan
        global_plan_marker_pub: /nav_executor/debug/global_plan
        minco_trajectory_pub: /nav_executor/debug/minco_trajectory
        # RViz 规划约束图：100 不可通行，0 可通行；不显示预测帧。
        planning_constraints_pub: /planning_constraints
        planning_constraints_marker_pub: /planning_constraints_markers
        # 独立执行器直接输出到底盘入口。
        cmd_vel_pub: /cmd_vel
        chassis_cmd_pub: /nav_executor/chassis_cmd
        region_status_pub: /nav_executor/region_status
        terrain_cost_sub: /cost_map
        terrain_label_sub: /terrain_label_map
        terrain_uphill_sub: /terrain_uphill_map
        online_terrain_label_sub: /nav_executor/online_terrain_map
      visualization:
        velocity_color_min: 0.0
        velocity_color_max: 3.0
        # 全局搜索折线的 RViz 样式。线宽是给「一眼看清全局拓扑」用的：MINCO 轨迹默认 0.07 m
        # 且按速度染色，两者叠在一起时全局折线必须更粗、颜色更跳，否则分不出来。
        global_plan_publish_hz: 5.0
        global_plan_line_width: 0.15
        global_plan_color_r: 0.0
        global_plan_color_g: 1.0
        global_plan_color_b: 1.0
