# Like HW/nav_executor, every config file uses a wildcard node selector and
# hierarchical parameter names. The embedded planner node receives this too.
/**:
  ros__parameters:
    planner:
      # Static terrain owns global topology; ROGMap supplies online occupancy and distance.
      planner_mode: EXPLORATION
      global_frame: odom
      frames:
        map_frame: map
        rog_frame: odom
      allow_unknown: false
      # 全局主搜索选择：true = SMAC 2D（含 ESDF 势场软代价），false = 退回 Astar（NavFn 波前）。
      # SMAC 失败直接失败、不自动回退 Astar，避免一次失败出现两条搜索与两套日志；本项是
      # configure-time 结构开关（决定 smac_planner_ 是否存在），运行时改会被拒绝。
      use_smac: true
      smac_2d:
        # 代价增量 = step * min(weight * exp(-dist/decay), max_cost)，dist 取自 TerrainMapQuery
        # 烘焙的二维有符号距离场（自由为正，上限 3.0 m），作用是让折线远离墙面、贴近走廊中线。
        # 这四项可以在线调（现场标定 esdf_weight / esdf_decay 不必重启）。
        use_esdf_cost: true
        esdf_weight: 1.0
        esdf_decay: 0.8
        # 势场封顶值 max_cost，取值必须 ≥ esdf_weight：否则 potential 在 d ≤ decay·ln2 内饱和、
        # 梯度为 0，搜索分不出"贴墙 5 cm"与"离墙 50 cm"，走廊净宽 ≤ ~1.1 m 时整条走廊都在
        # 饱和区，全局搜索只剩"最短路径"一个目标 → 贴内侧墙、切内角。
        # 5.0 与 1.0 行为等价（封顶不生效），取 5.0 只为显式表达"不封顶"，并与
        # smac_planner_2d_simple.hpp 的代码默认值一致；本项只影响全局折线形状与 MINCO 参考线，
        # 不改变任何净空判据。若现场仍偏贴墙，下一步再单变量调 esdf_weight（1.0 → 2.0）。
        esdf_max_cost: 5.0
      odom_topic: /Odometry
      tolerance: 0.3
      exploration:
        boundary_margin: 0.2
        boundary_sample_step: 0.1
        # 必须与 planner.rog_map.projection.unknown_as_occupied 保持一致（本项管全局搜索，
        # 那一项管二维 ESDF）；不一致时同一格会被判为不可通行又被判为自由，目标附近反复失败。
        unknown_as_occupied: false
        prefer_goal_direction: true
      corridor:
        robot_radius: 0.30
        extra_margin: 0.05
      minco_optimizer:
        lookahead_dist: 10.0
        traj_goal_tolerance: 0.15
        enable_yaw_opt: true
        max_yaw_dot: 5.0
        # 优化器位置罚项的软目标净空，只影响优化器，不影响任何硬判据（硬判据阈值来自
        # collision_dist + v * replan_react_time）。软目标只能被渐近逼近，必须比硬判据高出余量：
        # 0.33 留 0.07 余量，降到 0.30 时只剩 4 cm，窄处罚项梯度变小、轨迹不再被推回通道中心，
        # 表现为起步/前进一顿一顿；再动这一项必须单变量并同时看急停频率与 COLLISION 占比。
        safe_dist: 0.33
        # 有效硬阈值 = collision_dist − kMonitorClearanceTolerance(0.02) = 0.26 m，略小于车体
        # 外接圆半径 0.306 m，靠 ROGMap 读数偏保守（0.05 m 格子整格即判占据，小 2~5 cm）对上。
        # 不要再下调：0.27 会把有效阈值压到 0.25，等于重新允许蹭墙；窄道通过性应由降低感知
        # 延迟与统一判据口径解决。必须与 node.rog_map_clearance 保持一致。
        collision_dist: 0.28
        # 发布前校验与运行时监视共用同一条要求：
        # required = collision_dist + max(v * replan_react_time, monitor_margin)。
        # 两者曾用不同阈值，导致轨迹刚发布就被监视器判不安全 → 急停 + 重规划，车走不起来。
        # 设 0 表示静止时两者都等于 collision_dist，只有真的跑起来才追加制动距离余量；
        # 整体抬高安全余量前请确认最窄通道净空 > collision_dist + monitor_margin。
        monitor_margin: 0.0
        # 失败原因日志策略（仅排障，不影响规划行为）：按计数采样代替时间节流，失败再密也能
        # 保证每 N 次留下一条、样本量可预期，不随现场节奏退化。
        # failure_log_first_n: 0 = 不逐条打；failure_log_every_n: 1 = 每次都打（排障），
        # 0 = 退回旧的 2 s 节流；failure_summary_every: 0 = 不打汇总。
        failure_log_first_n: 10
        failure_log_every_n: 25
        failure_summary_every: 50
        # 第四层兜底：前三层（正常路径 → ROGMap 局部绕行 → 障碍前完整停车前缀）全失败时，
        # 退化成一个"不比当前实测净空更差"（减 0.02 m ESDF 抖动余量）、末速度为零的短前缀，
        # 把车挪出贴死状态。长度上限固定为一个车体半径 collision_dist，整段落在既有近场豁免
        # 半径内，因此不改动任何安全阈值；enable: false 即恢复三层行为。
        stuck_escape:
          enable: true
          # 安全段短于此值就不脱困（挪动太小没有意义）；实际可用长度 = 安全段 - buffer。
          min_length: 0.08
          # 收尾余量：前缀在第一个净空不足的采样点之前这么多米处结束。
          buffer: 0.05
        # 种子门只按"实际占据 / 地形不允许 / 查询失效"硬否决，折线净空不足交给 MINCO 优化，
        # 再由发布前 / 20 Hz 监视 / MPC 指令门按有效阈值验收。机器人当前位置附近（弧长
        # collision_dist 以内）是它已占住的地方，只要求"不比当前实测净空更差"；离开该段后
        # 必须满足 required，否则贴着墙停车就再也发不出轨迹。
        replan_period_s: 0.2
        # 制动距离预算：required = collision_dist + max(v * replan_react_time, monitor_margin)。
        # 该项让净空要求随速度增长，作用在整条轨迹上，因此同时是速度上限
        # v < (可用净空 − collision_dist) / replan_react_time；略超上限就会在最窄处被否，
        # 形成「加速 → 否决 → 急停 → 再加速」的极限环（现场表现为一卡一卡）。
        # 上游 navi_minco_bit 没有这一项，碰撞校验用固定 collision_dist；设 0 即对齐上游，
        # 代价是高速下不预留制动距离。若实车高速制动不及，从 0.05 起逐步回调。
        replan_react_time: 0.0
        # 速度感知净空：优化器的 ESDF 位置罚项改用 collision_dist + v * replan_react_time +
        # clearance_optimizer_margin，意在窄处主动减速而不是规划完再被检查器否掉。
        # 默认关闭：目标净空在 v > 0.33 m/s 后一律高于原固定值，且 penalty_weight_pos(50000)
        # 远大于 penalty_weight_time(100)，优化器用降速而非绕开来降低位置惩罚，结果全程变慢。
        speed_aware_clearance: false
        # 优化器软目标相对硬判据的余量（仅在 speed_aware_clearance 开启时生效）。
        clearance_optimizer_margin: 0.05
        safety_lookahead_time: 1.2
        max_velocity: 3.0
        max_acceleration: 4.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 1.0
        min_turn_vel: 0.8
        decay_power: 1.3
        opt_accuracy: 0.001
        print_optimizer_log: false
        # MINCO 时间正则 rho：cost += rho * ΣT，是轨迹速度的主要旋钮。100 为旧工程与 native
        # 最新提交共用的值；500 会把规划峰值推到约 2.51 m/s，底盘跟不上导致速度误差门反复重规划。
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5
      performance:
        enable: false
        print_enable: false
        odom_sub_debug_enable: false
      rog_map:
        frame_id: odom
        resolution: 0.05
        inflation_resolution: 0.05
        # Z 方向是容器上限：局部地图边界 = 地图中心 ± map_size/2，local_update_box 与
        # visualization.range 都会被 updateLocalBox()/boundBoxByLocalMap() 夹到这里。
        # 2.5 -> ±1.25 m，扣除 map_sliding.threshold 0.2 的跟随滞后后约 ±1.05 m。
        map_size: [10.0, 10.0, 2.5]
        fix_map_origin: [0.0, 0.0, 0.0]
        # prob_map.cpp 的 getGridType() 把 z <= 本值的体素一律判为 OCCUPIED，因此本值必须低于
        # projection.scan_z_min_abs（当前 -1.2，相对雷达），否则投影窗口会探到地面以下，每个柱子
        # 凭空多出 4 个体素的虚假占据，污染 occupied_count / 高度差 / 占据率等分类统计。此处对齐
        # 旧工程 /home/mas/mas_nav_2027 的 -1.5。
        virtual_ground_height: -1.5
        virtual_ceil_height: 3.0
        map_sliding:
          enable: true
          threshold: 0.2
        ros_callback:
          enable: true
          cloud_topic: /cloud_registered
          odom_topic: /Odometry
          odom_timeout: 0.08
          update_period_ms: 20
        raycasting:
          enable: true
          batch_update_size: 1
          # 近距下限必须盖住车体半径，否则车身点云会写入 ROGMap，
          # 轨迹安全检查在原点附近报 clearance≈0.28 m < 0.30 m 并持续 COLLISION/急停。
          # 默认与 rog_map 核心一致为 0.3；勿再降到接近 0。
          ray_range: [0.3, 10.0]
          # Z 半高 = 4.0/2 = ±2.0 m。超出该盒子的点云会被投影到盒壁并记为 miss，
          # 不会成为占据体素。注意它最终还会被夹到 map_size/2 的局部地图边界内。
          local_update_box: [10.0, 10.0, 2.0]
          p_hit: 0.9
          p_miss: 0.45
          p_occ: 0.85
          p_free: 0.499
          parallel_enable: false
        decay:
          enable: true
          keep_time: 0.8
          clear_time: 1.2
        projection:
          enable: true
          scan_z_relative_to_robot: true
          # ROGMap 静态先验融合（当前关闭）：静态地形仍由 map_server 供给全局搜索和地形轨迹门，
          # ROGMap 保持旧的实时局部障碍职责。
          prior_map:
            # 本车 map↔odom 下曾有错位记录，开启后会把净空压到安全阈值以下并叠加成永久拒绝；
            # 重新开启前必须先专项验证图对齐。
            enable: false
            yaml_path: "/home/mas/mas_nav_2027_native/src/mas2027_nav_bringup/map/lab3.yaml"
            # 留空时使用 YAML 的 image 字段，并相对 YAML 所在目录解析。
            pgm_path: ""
            frame_id: map
          scan_z_min_abs: -1.2
          scan_z_max_abs: 2.75
          unknown_as_occupied: false
          min_observed_voxels: 1
          surface_height_delta_max: 0.2
          wall_height_delta_min: 0.80
          wall_occupancy_ratio_min: 0.90
          tunnel_height_delta_min: 0.25
          tunnel_height_delta_max: 0.75
          tunnel_occupancy_ratio_max: 0.45
          passable_as_free: true
          hysteresis_enable: false
          obstacle_hold_time: 1.5
          mask_filter_en: true
          fill_occ_min: 8
          denoise_occ_max: 0
        field:
          enable: true
          inflation_radius: 0.0
          max_distance: 6.0
          min_distance: -3.0
          interpolation: quadratic
          update_rate: 20.0
        performance:
          # 打开后按 summary_rate 写每秒统计 CSV（开销极小），用于坐实建图积压：
          # cloud_callback_hz 是点云回调频率（输入），valid_update_hz 明显低于它即积压，
          # 各 *_time 列用来看瓶颈在哪一段。print_enable 打到 stdout（不进 ROS 日志文件），
          # 排障优先用 CSV；detailed_csv_enable 每次更新写一行、开销大，仅在需要逐帧时序时打开。
          enable: true
          summary_csv_enable: true
          # 路径必须落在工作区内：写到 /tmp 时排障侧读不到（实车运行在用户自己的 shell 里，
          # 与工具的临时目录不是同一处）。该目录已存在，换机器请确认路径可写。
          summary_csv_path: "/home/mas/mas_nav_2027_native/.scratch/rog_map_perf_summary.csv"
          summary_rate: 1.0
          # 打开后每次地图更新写一行，用于拆分单次更新的耗时构成（prob_update / decay /
          # query_refresh / update_unaccounted_ms / last_viz_time_ms / full_reason_* 是否静默
          # 退回全量）。约 20 行/s，开销可忽略，定位完即可改回 false。
          detailed_csv_enable: true
          print_enable: false
          # 只处理脏列的增量投影。默认全量：每帧重算整张 200×200 二维窗口约 43 ms，更新耗时
          # 超过点云帧周期（约 35% 的帧被丢）。脏列超过 dirty_full_ratio 时自动回退全量，
          # 不会漏更新；但 ray_range [0.3, 10.0] 几乎扫过 10×10 m 窗口所有柱子，脏列占比常达
          # ~50%，阈值 0.30 会让增量分支永不生效，故放到 0.95 并引入 dirty_full_period_s=0.5
          # 周期性全量兜底（最多旧 0.5 s）。一键回退：dirty_column_enable 改回 false，无需重编。
          dirty_column_enable: true
          dirty_full_ratio: 0.95
          dirty_full_period_s: 0.5
        visualization:
          enable: true
          frame_id: odom
          rate: 5.0
          # Z 半高 = 4.0/2 = ±2.0 m，决定 /rog_map/occupied 的上下边界（紫色块）。
          # 实际发布范围会被 boundBoxByLocalMap 夹到 min(map_size/2, virtual_ceil)。
          range: [10.0, 10.0, 1.5]
