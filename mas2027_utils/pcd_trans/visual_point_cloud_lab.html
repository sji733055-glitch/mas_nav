<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web点云可视化处理工具 Pro v2.7 (Map Rotate Export)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .ui-panel { z-index: 10; }
        .ui-float { pointer-events: auto; max-height: min(72vh, 640px); overflow-y: auto; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #3b82f6; cursor: pointer; margin-top: -8px; border: 2px solid #1f2937;
            box-shadow: 0 0 4px rgba(0,0,0,0.5); 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px;
        }
        /* 去掉 number input 的箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 3px solid #3b82f6;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #error-boundary {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
            pointer-events: none; padding: 20px;
        }
        .error-msg {
            background: rgba(220, 38, 38, 0.9); color: white; padding: 10px 20px;
            border-radius: 5px; margin-bottom: 10px; pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="error-boundary"></div>
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            const div = document.createElement('div');
            div.className = 'error-msg';
            div.innerHTML = `<strong>系统错误:</strong> ${msg}<br><small>${url}:${line}</small>`;
            document.getElementById('error-boundary').appendChild(div);
            return false;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- 1. PCD 解析器（ascii / binary / binary_compressed） ---
        const fieldCount = (header, i) => Array.isArray(header.count) ? (header.count[i] || 1) : 1;

        const lzfDecompress = (input, outLen) => {
            const out = new Uint8Array(outLen);
            let ip = 0, op = 0;
            const inLen = input.length;
            while (ip < inLen) {
                let ctrl = input[ip++];
                if (ctrl < 32) {
                    ctrl++;
                    if (op + ctrl > outLen || ip + ctrl > inLen) throw new Error("LZF literal overflow");
                    for (let i = 0; i < ctrl; i++) out[op++] = input[ip++];
                } else {
                    let len = ctrl >> 5;
                    let ref = op - ((ctrl & 0x1f) << 8) - 1;
                    if (ip >= inLen) throw new Error("LZF truncated");
                    if (len === 7) {
                        len += input[ip++];
                        if (ip >= inLen) throw new Error("LZF truncated");
                    }
                    ref -= input[ip++];
                    if (ref < 0 || op + len + 2 > outLen) throw new Error("LZF backref overflow");
                    out[op++] = out[ref++];
                    out[op++] = out[ref++];
                    while (len--) out[op++] = out[ref++];
                }
            }
            return out;
        };

        const parsePCD = (buffer) => {
            const textDecoder = new TextDecoder();
            const header = { data: 'ascii', fields: [], size: [], type: [], count: [], points: 0, headerLen: 0 };
            const view = new Uint8Array(buffer);
            let line = '';
            let ptr = 0;
            while (ptr < buffer.byteLength) {
                const char = String.fromCharCode(view[ptr]);
                ptr++;
                if (char === '\n') {
                    const cleanLine = line.replace(/\r/g, '').trim();
                    if (cleanLine.length > 0 && !cleanLine.startsWith('#')) {
                        const parts = cleanLine.split(/\s+/);
                        const tag = parts[0].toUpperCase();
                        if (tag === 'FIELDS') header.fields = parts.slice(1).map(f => f.toLowerCase());
                        else if (tag === 'SIZE') header.size = parts.slice(1).map(x => parseInt(x, 10));
                        else if (tag === 'TYPE') header.type = parts.slice(1);
                        else if (tag === 'COUNT') header.count = parts.slice(1).map(x => parseInt(x, 10));
                        else if (tag === 'WIDTH') header.points = parseInt(parts[1], 10);
                        else if (tag === 'POINTS') header.points = parseInt(parts[1], 10);
                        else if (tag === 'DATA') { header.data = parts[1].toLowerCase(); header.headerLen = ptr; break; }
                    }
                    line = '';
                } else { line += char; }
            }
            if (header.count.length === 0) header.count = header.fields.map(() => 1);
            const xIdx = header.fields.indexOf('x'); const yIdx = header.fields.indexOf('y'); const zIdx = header.fields.indexOf('z');
            if (xIdx === -1 || yIdx === -1 || zIdx === -1) throw new Error("PCD 文件缺少 x, y, z 字段");
            const points = [];
            const readFloat = (dv, offset, size) => {
                if (size === 8) return dv.getFloat64(offset, true);
                return dv.getFloat32(offset, true);
            };
            if (header.data === 'ascii') {
                const bodyStr = textDecoder.decode(buffer.slice(header.headerLen));
                const lines = bodyStr.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const l = lines[i].trim();
                    if (l === '') continue;
                    const parts = l.split(/\s+/);
                    if (parts.length > zIdx) {
                        const x = parseFloat(parts[xIdx]), y = parseFloat(parts[yIdx]), z = parseFloat(parts[zIdx]);
                        if (!isNaN(x) && !isNaN(y) && !isNaN(z)) points.push(x, y, z);
                    }
                }
            } else if (header.data === 'binary') {
                const dataView = new DataView(buffer, header.headerLen);
                let rowStep = 0;
                for (let i = 0; i < header.fields.length; i++) rowStep += header.size[i] * fieldCount(header, i);
                let xOffset = 0, yOffset = 0, zOffset = 0;
                for (let i = 0; i < xIdx; i++) xOffset += header.size[i] * fieldCount(header, i);
                for (let i = 0; i < yIdx; i++) yOffset += header.size[i] * fieldCount(header, i);
                for (let i = 0; i < zIdx; i++) zOffset += header.size[i] * fieldCount(header, i);
                for (let i = 0; i < header.points; i++) {
                    const rowStart = i * rowStep;
                    if (rowStart + rowStep > dataView.byteLength) break;
                    points.push(
                        readFloat(dataView, rowStart + xOffset, header.size[xIdx]),
                        readFloat(dataView, rowStart + yOffset, header.size[yIdx]),
                        readFloat(dataView, rowStart + zOffset, header.size[zIdx])
                    );
                }
            } else if (header.data === 'binary_compressed') {
                const prefix = new DataView(buffer, header.headerLen);
                const compressedSize = prefix.getUint32(0, true);
                const uncompressedSize = prefix.getUint32(4, true);
                const compressed = new Uint8Array(buffer, header.headerLen + 8, compressedSize);
                const uncompressed = lzfDecompress(compressed, uncompressedSize);
                if (uncompressed.length < uncompressedSize) throw new Error("LZF 解压长度不够");
                const uview = new DataView(uncompressed.buffer, uncompressed.byteOffset, uncompressed.byteLength);
                const n = header.points;
                const fieldOffsets = [];
                let off = 0;
                for (let i = 0; i < header.fields.length; i++) {
                    fieldOffsets.push(off);
                    off += header.size[i] * fieldCount(header, i) * n;
                }
                const xOff = fieldOffsets[xIdx], yOff = fieldOffsets[yIdx], zOff = fieldOffsets[zIdx];
                const xSize = header.size[xIdx], ySize = header.size[yIdx], zSize = header.size[zIdx];
                for (let i = 0; i < n; i++) {
                    points.push(
                        readFloat(uview, xOff + i * xSize, xSize),
                        readFloat(uview, yOff + i * ySize, ySize),
                        readFloat(uview, zOff + i * zSize, zSize)
                    );
                }
            } else {
                throw new Error("不支持的 PCD DATA 类型: " + header.data + "（需要 ascii / binary / binary_compressed）");
            }
            return new Float32Array(points);
        };

        const parseMapYaml = (text) => {
            const result = {};
            for (const rawLine of text.split(/\r?\n/)) {
                const line = rawLine.replace(/#.*$/, '');
                const m = line.match(/^\s*(image|resolution|origin)\s*:\s*(.*)$/);
                if (!m) continue;
                if (m[1] === 'resolution') result.resolution = parseFloat(m[2]);
                if (m[1] === 'origin') {
                    const nums = m[2].replace(/[\[\]]/g, '').split(',').map(s => parseFloat(s.trim()));
                    result.originX = nums[0];
                    result.originY = nums[1];
                }
            }
            if (result.originX === undefined && result.resolution === undefined) throw new Error("YAML 里没有 origin / resolution");
            return result;
        };

        // --- 2. PGM 解析器 ---
        const parsePGM = (buffer) => {
            const view = new Uint8Array(buffer);
            let ptr = 0;
            const nextWord = () => {
                let word = '';
                while (ptr < view.length) {
                    let code = view[ptr];
                    let char = String.fromCharCode(code);
                    ptr++;
                    if (char === '#') { while (ptr < view.length && view[ptr] !== 10) ptr++; } 
                    else if (code <= 32) { if (word.length > 0) return word; } 
                    else { word += char; }
                }
                return word;
            };
            const magic = nextWord();
            if (magic !== 'P5' && magic !== 'P2') throw new Error("仅支持 PGM (P2/P5) 格式");
            const width = parseInt(nextWord());
            const height = parseInt(nextWord());
            const maxVal = parseInt(nextWord());
            const pixelCount = width * height;
            const data = new Uint8Array(pixelCount);
            if (magic === 'P5') {
                if (view.length - ptr < pixelCount) {
                    const start = view.length - pixelCount;
                    data.set(view.slice(start, view.length));
                } else {
                    data.set(view.slice(ptr, ptr + pixelCount));
                }
            } else {
                let valIdx = 0;
                while(valIdx < pixelCount) {
                    const w = nextWord();
                    if(!w) break;
                    data[valIdx++] = parseInt(w);
                }
            }
            return { width, height, data, maxVal };
        };

        // --- 3. 滤波 ---
        const voxelGridFilter = (points, leafSize) => {
            if (leafSize <= 0) return points;
            const voxelMap = new Map();
            const invLeaf = 1.0 / leafSize;
            for (let i = 0; i < points.length; i += 3) {
                const x = points[i], y = points[i+1], z = points[i+2];
                const ix = Math.floor(x * invLeaf), iy = Math.floor(y * invLeaf), iz = Math.floor(z * invLeaf);
                const key = `${ix},${iy},${iz}`;
                if (!voxelMap.has(key)) voxelMap.set(key, { sx: x, sy: y, sz: z, count: 1 });
                else { const v = voxelMap.get(key); v.sx += x; v.sy += y; v.sz += z; v.count++; }
            }
            const filtered = [];
            voxelMap.forEach(v => filtered.push(v.sx / v.count, v.sy / v.count, v.sz / v.count));
            return new Float32Array(filtered);
        };

        const generateDemoData = () => {
            const points = [];
            for (let i = 0; i < 15000; i++) {
                const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2;
                const R = 10, r = 4;
                points.push(
                    (R + r * Math.cos(v)) * Math.cos(u) + (Math.random() - 0.5) * 0.2, // x
                    (R + r * Math.cos(v)) * Math.sin(u) + (Math.random() - 0.5) * 0.2, // y
                    r * Math.sin(v) + (Math.random() - 0.5) * 0.2 // z
                );
            }
            return new Float32Array(points);
        };

        // --- 3D Viewer (Z-UP MODE) ---
        const PointCloudViewer = ({ points, transforms, cropSettings, setCropSettings, setBoundingBoxInfo, mapData, mapSettings }) => {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const rendererRef = useRef(null);
            const cameraRef = useRef(null);
            const pointsRef = useRef(null);
            const boxHelperRef = useRef(null);
            const cropBoxHelperRef = useRef(null);
            const mapMeshRef = useRef(null);
            const requestRef = useRef(null);
            const isDragging = useRef(false);
            const isRightDragging = useRef(false);
            const lastMouse = useRef({ x: 0, y: 0 });
            const camState = useRef({ r: 40, theta: Math.PI/4, phi: Math.PI/3, target: new THREE.Vector3() });
            const raycasterRef = useRef(new THREE.Raycaster());
            const cropDragRef = useRef(null);

            if (typeof THREE === 'undefined') throw new Error("Three.js Not Loaded");

            useEffect(() => {
                const w = window.innerWidth, h = window.innerHeight;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x111827);
                sceneRef.current = scene;

                const grid = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
                grid.rotation.x = Math.PI / 2; 
                scene.add(grid);
                scene.add(new THREE.AxesHelper(5));
                scene.add(new THREE.AmbientLight(0xffffff, 1));

                const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 2000);
                camera.up.set(0, 0, 1);
                cameraRef.current = camera;
                updateCam();

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', onResize);

                const animate = () => {
                    requestRef.current = requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    window.removeEventListener('resize', onResize);
                    cancelAnimationFrame(requestRef.current);
                    if (mountRef.current && renderer.domElement) mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            const updateCam = () => {
                if (!cameraRef.current) return;
                const { r, theta, phi, target } = camState.current;
                const x = target.x + r * Math.sin(phi) * Math.cos(theta);
                const y = target.y + r * Math.sin(phi) * Math.sin(theta);
                const z = target.z + r * Math.cos(phi);
                cameraRef.current.position.set(x, y, z);
                cameraRef.current.lookAt(target);
            };

            useEffect(() => {
                if (!sceneRef.current || !points) return;
                if (pointsRef.current) {
                    sceneRef.current.remove(pointsRef.current);
                    sceneRef.current.remove(boxHelperRef.current);
                    pointsRef.current.geometry.dispose();
                    pointsRef.current.material.dispose();
                }
                
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(points, 3));
                
                let minZ = Infinity, maxZ = -Infinity;
                for(let i=2; i<points.length; i+=3) {
                    if(points[i] < minZ) minZ = points[i];
                    if(points[i] > maxZ) maxZ = points[i];
                }
                const range = maxZ - minZ || 1;
                const colors = [];
                const c1 = new THREE.Color(0x3b82f6), c2 = new THREE.Color(0x10b981);
                for(let i=0; i<points.length; i+=3) {
                    const t = (points[i+2] - minZ) / range;
                    const c = c1.clone().lerp(c2, t);
                    colors.push(c.r, c.g, c.b);
                }
                geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));

                const mesh = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.15, vertexColors: true }));
                pointsRef.current = mesh;
                sceneRef.current.add(mesh);

                const boxHelp = new THREE.BoxHelper(mesh, 0xffff00);
                boxHelperRef.current = boxHelp;
                sceneRef.current.add(boxHelp);

                geo.computeBoundingBox();
                const b = geo.boundingBox;
                if(b) {
                    const s = new THREE.Vector3(), c = new THREE.Vector3();
                    b.getSize(s); b.getCenter(c);
                    setBoundingBoxInfo({ count: points.length/3, size: {x:s.x,y:s.y,z:s.z}, center: {x:c.x,y:c.y,z:c.z} });
                }
            }, [points]);

            const mapFitRef = useRef(null);

            useEffect(() => {
                if(!sceneRef.current) return;
                if(mapMeshRef.current) {
                    sceneRef.current.remove(mapMeshRef.current);
                    if (mapMeshRef.current.material.map) mapMeshRef.current.material.map.dispose();
                    mapMeshRef.current.geometry.dispose();
                    mapMeshRef.current.material.dispose();
                    mapMeshRef.current = null;
                }
                if(mapData && mapSettings.visible) {
                    const { width, height, data } = mapData;
                    const rgba = new Uint8Array(width*height*4);
                    for(let i=0; i<width*height; i++) {
                        const val = data[i];
                        const idx = i*4;
                        // Nav2 PGM: 0 occupied, 205 unknown, 254 free. Black-on-dark was invisible.
                        if(val <= 10) { rgba[idx]=255; rgba[idx+1]=140; rgba[idx+2]=0; rgba[idx+3]=230; }
                        else if(val >= 250) { rgba[idx]=230; rgba[idx+1]=230; rgba[idx+2]=235; rgba[idx+3]=80; }
                        else { rgba[idx]=90; rgba[idx+1]=100; rgba[idx+2]=120; rgba[idx+3]=50; }
                    }
                    const tex = new THREE.DataTexture(rgba, width, height, THREE.RGBAFormat);
                    tex.flipY = mapSettings.flipY;
                    tex.minFilter = THREE.NearestFilter;
                    tex.magFilter = THREE.NearestFilter;
                    tex.needsUpdate = true;
                    
                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: mapSettings.opacity, side: THREE.DoubleSide });
                    const planeWidth = width*mapSettings.resolution;
                    const planeHeight = height*mapSettings.resolution;
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(planeWidth, planeHeight), mat);
                    
                    const cx = mapSettings.originX + planeWidth / 2.0;
                    const cy = mapSettings.originY + planeHeight / 2.0;

                    plane.position.set(cx, cy, mapSettings.zOffset);
                    plane.rotation.z = THREE.MathUtils.degToRad(mapSettings.rotation);

                    sceneRef.current.add(plane);
                    mapMeshRef.current = plane;
                    const fitKey = `${width}x${height}:${mapSettings.originX},${mapSettings.originY},${mapSettings.resolution}`;
                    if (mapFitRef.current !== fitKey) {
                        mapFitRef.current = fitKey;
                        camState.current.target.set(cx, cy, 0);
                        camState.current.r = Math.max(planeWidth, planeHeight) * 0.9 + 5;
                        updateCam();
                    }
                }
            }, [mapData, mapSettings]);

            useEffect(() => {
                if(pointsRef.current) {
                    pointsRef.current.position.set(transforms.x, transforms.y, transforms.z);
                    pointsRef.current.rotation.set(THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ));
                    pointsRef.current.updateMatrixWorld();
                    if(boxHelperRef.current) boxHelperRef.current.update();
                }
            }, [transforms]);

            useEffect(() => {
                if(!sceneRef.current) return;
                if(cropBoxHelperRef.current) {
                    sceneRef.current.remove(cropBoxHelperRef.current);
                    cropBoxHelperRef.current.traverse(o => {
                        if (o.geometry) o.geometry.dispose();
                        if (o.material) o.material.dispose();
                    });
                    cropBoxHelperRef.current = null;
                }
                if(cropSettings.active) {
                    const w = Math.max(0.2, cropSettings.maxX - cropSettings.minX);
                    const h = Math.max(0.2, cropSettings.maxY - cropSettings.minY);
                    const d = Math.max(0.2, cropSettings.maxZ - cropSettings.minZ);
                    const cx = (cropSettings.minX+cropSettings.maxX)/2, cy = (cropSettings.minY+cropSettings.maxY)/2, cz = (cropSettings.minZ+cropSettings.maxZ)/2;
                    const group = new THREE.Group();
                    const body = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide })
                    );
                    body.userData = { crop: true, mode: 'move' };
                    group.add(body);
                    const thick = Math.max(0.18, Math.min(w, h, d) * 0.045);
                    const faces = [
                        { axis: 'X', sign: 1, color: 0xff5555 },
                        { axis: 'X', sign: -1, color: 0xff5555 },
                        { axis: 'Y', sign: 1, color: 0x55ff88 },
                        { axis: 'Y', sign: -1, color: 0x55ff88 },
                        { axis: 'Z', sign: 1, color: 0x5599ff },
                        { axis: 'Z', sign: -1, color: 0x5599ff },
                    ];
                    faces.forEach(f => {
                        let geo;
                        if (f.axis === 'X') geo = new THREE.BoxGeometry(thick, h * 1.02, d * 1.02);
                        else if (f.axis === 'Y') geo = new THREE.BoxGeometry(w * 1.02, thick, d * 1.02);
                        else geo = new THREE.BoxGeometry(w * 1.02, h * 1.02, thick);
                        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                            color: f.color, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide
                        }));
                        mesh.position.set(f.axis==='X'?f.sign*w/2:0, f.axis==='Y'?f.sign*h/2:0, f.axis==='Z'?f.sign*d/2:0);
                        mesh.userData = { crop: true, mode: 'resize', axis: f.axis, sign: f.sign };
                        group.add(mesh);
                    });
                    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)), new THREE.LineBasicMaterial({ color: 0xff3333 }));
                    group.add(edges);
                    group.position.set(cx, cy, cz);
                    cropBoxHelperRef.current = group;
                    sceneRef.current.add(group);
                }
            }, [cropSettings]);

            const getNdc = (e) => {
                const el = rendererRef.current && rendererRef.current.domElement;
                const r = el ? el.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
            };
            const hitCrop = (e) => {
                if (!cropSettings.active || !cropBoxHelperRef.current || !cameraRef.current) return null;
                raycasterRef.current.setFromCamera(getNdc(e), cameraRef.current);
                const hits = raycasterRef.current.intersectObject(cropBoxHelperRef.current, true);
                for (let i = 0; i < hits.length; i++) {
                    if (hits[i].object.userData && hits[i].object.userData.crop) return hits[i];
                }
                return null;
            };

            const onMouseDown = e => {
                lastMouse.current = {x:e.clientX, y:e.clientY};
                if (e.button === 2) { isRightDragging.current = true; return; }
                if (e.button !== 0) return;
                const hit = hitCrop(e);
                if (hit) {
                    const ud = hit.object.userData;
                    let plane;
                    if (ud.mode === 'move') {
                        if (e.shiftKey) {
                            const fwd = new THREE.Vector3();
                            cameraRef.current.getWorldDirection(fwd);
                            fwd.z = 0;
                            if (fwd.lengthSq() < 1e-8) fwd.set(1, 0, 0); else fwd.normalize();
                            plane = new THREE.Plane().setFromNormalAndCoplanarPoint(fwd, hit.point);
                        } else {
                            plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -hit.point.z);
                        }
                    } else {
                        const axisVec = new THREE.Vector3(ud.axis==='X'?1:0, ud.axis==='Y'?1:0, ud.axis==='Z'?1:0);
                        const camDir = new THREE.Vector3();
                        cameraRef.current.getWorldDirection(camDir);
                        let n = new THREE.Vector3().crossVectors(camDir, axisVec);
                        if (n.lengthSq() < 1e-8) n.set(axisVec.x ? 0 : 1, 0, axisVec.x ? 1 : 0);
                        n.cross(axisVec);
                        if (n.lengthSq() < 1e-8) n.set(0, 0, 1); else n.normalize();
                        plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, hit.point);
                    }
                    cropDragRef.current = {
                        mode: ud.mode, axis: ud.axis, sign: ud.sign || 0, shift: e.shiftKey,
                        startHit: hit.point.clone(), startCrop: { ...cropSettings }, plane
                    };
                    return;
                }
                isDragging.current = true;
            };
            const onMouseUp = () => { isDragging.current=false; isRightDragging.current=false; cropDragRef.current=null; };
            const onMouseMove = e => {
                const drag = cropDragRef.current;
                if (drag && cameraRef.current) {
                    raycasterRef.current.setFromCamera(getNdc(e), cameraRef.current);
                    const now = new THREE.Vector3();
                    if (!raycasterRef.current.ray.intersectPlane(drag.plane, now)) return;
                    const dx = now.x - drag.startHit.x, dy = now.y - drag.startHit.y, dz = now.z - drag.startHit.z;
                    const s = drag.startCrop;
                    const next = { ...s, active: true };
                    const minSize = 0.2;
                    if (drag.mode === 'move') {
                        if (drag.shift) {
                            next.minZ = s.minZ + dz; next.maxZ = s.maxZ + dz;
                        } else {
                            next.minX = s.minX + dx; next.maxX = s.maxX + dx;
                            next.minY = s.minY + dy; next.maxY = s.maxY + dy;
                        }
                    } else if (drag.axis === 'X') {
                        if (drag.sign > 0) next.maxX = Math.max(s.minX + minSize, s.maxX + dx);
                        else next.minX = Math.min(s.maxX - minSize, s.minX + dx);
                    } else if (drag.axis === 'Y') {
                        if (drag.sign > 0) next.maxY = Math.max(s.minY + minSize, s.maxY + dy);
                        else next.minY = Math.min(s.maxY - minSize, s.minY + dy);
                    } else if (drag.axis === 'Z') {
                        if (drag.sign > 0) next.maxZ = Math.max(s.minZ + minSize, s.maxZ + dz);
                        else next.minZ = Math.min(s.maxZ - minSize, s.minZ + dz);
                    }
                    setCropSettings(next);
                    return;
                }
                const dx = e.clientX - lastMouse.current.x, dy = e.clientY - lastMouse.current.y;
                lastMouse.current = {x:e.clientX, y:e.clientY};
                if(isDragging.current) {
                    camState.current.theta -= dx*0.01;
                    camState.current.phi -= dy*0.01;
                    camState.current.phi = Math.max(0.1, Math.min(Math.PI-0.1, camState.current.phi));
                    updateCam();
                } else if(isRightDragging.current) {
                    const fwd = new THREE.Vector3();
                    cameraRef.current.getWorldDirection(fwd);
                    fwd.z = 0; fwd.normalize();
                    const rt = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,0,1));
                    camState.current.target.addScaledVector(rt, -dx*0.05);
                    camState.current.target.addScaledVector(fwd, dy*0.05);
                    updateCam();
                } else if (mountRef.current) {
                    const hit = hitCrop(e);
                    if (hit) {
                        const ud = hit.object.userData;
                        mountRef.current.style.cursor = ud.mode === 'move' ? 'move' : (ud.axis === 'Z' ? 'ns-resize' : 'ew-resize');
                    } else {
                        mountRef.current.style.cursor = 'grab';
                    }
                }
            };
            const onWheel = e => {
                camState.current.r += e.deltaY*0.05; camState.current.r = Math.max(1, camState.current.r);
                updateCam();
            };

            return <div ref={mountRef} className="canvas-container cursor-move" onMouseDown={onMouseDown} onMouseUp={onMouseUp} onMouseMove={onMouseMove} onMouseLeave={onMouseUp} onWheel={onWheel} onContextMenu={e=>e.preventDefault()} />;
        };

        const App = () => {
            const [points, setPoints] = useState(generateDemoData());
            const [mapData, setMapData] = useState(null);
            const [activeTab, setActiveTab] = useState(null);
            const toggleTab = (t) => setActiveTab(cur => cur === t ? null : t);
            const [transforms, setTransforms] = useState({ x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0 });
            const [cropSettings, setCropSettings] = useState({ active:false, minX:-20,maxX:20, minY:-20,maxY:20, minZ:-20,maxZ:20 });
            const [mapSettings, setMapSettings] = useState({ resolution:0.05, opacity:0.6, visible:true, rotation:0, zOffset:-0.5, originX: 0.0, originY: 0.0, flipY: true });
            const [voxelLeaf, setVoxelLeaf] = useState(0.5);
            const [filtering, setFiltering] = useState(false);
            const [info, setInfo] = useState({ count:0, size:{x:0,y:0,z:0}, center:{x:0,y:0,z:0} });
            const [pickedYaml, setPickedYaml] = useState('');
            const [pickedPgm, setPickedPgm] = useState('');
            const [pickedPcd, setPickedPcd] = useState('');

            const handleFile = e => {
                const f = e.target.files[0]; if(!f) return;
                setPickedPcd(f.name);
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        let pts;
                        if(f.name.toLowerCase().endsWith('.pcd')) pts = parsePCD(ev.target.result);
                        else {
                            const lines = ev.target.result.split(/\r\n|\n/);
                            const arr = [];
                            lines.forEach(l => {
                                if(l.startsWith('#')) return;
                                const p = l.trim().split(/\s+/);
                                if(p.length>=3) {
                                    const x=parseFloat(p[0]), y=parseFloat(p[1]), z=parseFloat(p[2]);
                                    if(!isNaN(x)&&!isNaN(y)&&!isNaN(z)) arr.push(x,y,z);
                                }
                            });
                            pts = new Float32Array(arr);
                        }
                        if(pts && pts.length) { setPoints(pts); setTransforms({x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0}); }
                        else alert("未找到点数据");
                    } catch(err) { alert("解析失败: "+err.message); }
                };
                if(f.name.toLowerCase().endsWith('.pcd')) r.readAsArrayBuffer(f); else r.readAsText(f);
            };

            const handleYaml = e => {
                const f = e.target.files[0]; if(!f) return;
                setPickedYaml(f.name);
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        const y = parseMapYaml(ev.target.result);
                        setMapSettings(s => ({
                            ...s,
                            resolution: Number.isFinite(y.resolution) ? y.resolution : s.resolution,
                            originX: Number.isFinite(y.originX) ? y.originX : s.originX,
                            originY: Number.isFinite(y.originY) ? y.originY : s.originY,
                        }));
                    } catch(err) { alert("YAML 解析失败: "+err.message); }
                };
                r.readAsText(f);
            };
            const handlePgm = e => {
                const f = e.target.files[0]; if(!f) return;
                setPickedPgm(f.name);
                const r = new FileReader();
                r.onload = ev => {
                    try { setMapData(parsePGM(ev.target.result)); } catch(err) { alert("地图解析失败: "+err.message); }
                };
                r.readAsArrayBuffer(f);
            };

            const doExportMap = () => {
                if (!mapData) return;
                const { width, height, data } = mapData;
                
                // 1. 创建源 Canvas
                const srcCanvas = document.createElement('canvas');
                srcCanvas.width = width;
                srcCanvas.height = height;
                const ctx = srcCanvas.getContext('2d');
                const imgData = ctx.createImageData(width, height);
                
                // 填充源数据
                for(let i=0; i<width*height; i++) {
                    const val = data[i];
                    imgData.data[i*4] = val;
                    imgData.data[i*4+1] = val;
                    imgData.data[i*4+2] = val;
                    imgData.data[i*4+3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);

                // 2. 计算旋转后的新尺寸
                const angleRad = THREE.MathUtils.degToRad(mapSettings.rotation);
                const absCos = Math.abs(Math.cos(angleRad));
                const absSin = Math.abs(Math.sin(angleRad));
                const newWidth = Math.ceil(width * absCos + height * absSin);
                const newHeight = Math.ceil(width * absSin + height * absCos);

                // 3. 创建目标 Canvas 并旋转绘制
                const dstCanvas = document.createElement('canvas');
                dstCanvas.width = newWidth;
                dstCanvas.height = newHeight;
                const dCtx = dstCanvas.getContext('2d');
                
                // 填充背景为灰色 (ROS Unknown 205)
                dCtx.fillStyle = "rgb(205,205,205)"; 
                dCtx.fillRect(0, 0, newWidth, newHeight);

                dCtx.translate(newWidth/2, newHeight/2);
                dCtx.rotate(-angleRad); // Canvas 旋转方向通常顺时针，需要注意
                // 如果需要和显示一致，可能需要根据 mapSettings.flipY 调整
                if(mapSettings.flipY) dCtx.scale(1, -1);
                dCtx.drawImage(srcCanvas, -width/2, -height/2);

                // 4. 导出为 PGM (P5 Binary)
                const resData = dCtx.getImageData(0, 0, newWidth, newHeight).data;
                const pgmHeader = `P5\n${newWidth} ${newHeight}\n255\n`;
                const headerBytes = new TextEncoder().encode(pgmHeader);
                const pgmBody = new Uint8Array(newWidth * newHeight);
                
                for(let i=0; i<newWidth*newHeight; i++) {
                    // 取红色通道作为灰度值
                    pgmBody[i] = resData[i*4];
                }

                const blob = new Blob([headerBytes, pgmBody], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'rotated_map.pgm';
                a.click();
                URL.revokeObjectURL(url);
            };

            const doFilter = () => {
                setFiltering(true);
                setTimeout(() => {
                    setPoints(voxelGridFilter(points, voxelLeaf));
                    setFiltering(false);
                }, 50);
            };
            
            const doCrop = () => {
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3(), arr=[];
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    if(v.x>=cropSettings.minX && v.x<=cropSettings.maxX && v.y>=cropSettings.minY && v.y<=cropSettings.maxY && v.z>=cropSettings.minZ && v.z<=cropSettings.maxZ)
                        arr.push(v.x, v.y, v.z);
                }
                if(!arr.length) return alert("区域内无点");
                setPoints(new Float32Array(arr));
                setTransforms({x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0});
                setCropSettings({...cropSettings, active:false});
            };

            const fitCropToCloud = () => {
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3();
                let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
                for(let i=0;i<points.length;i+=3){
                    v.set(points[i],points[i+1],points[i+2]).applyMatrix4(m);
                    if(v.x<minX)minX=v.x; if(v.x>maxX)maxX=v.x;
                    if(v.y<minY)minY=v.y; if(v.y>maxY)maxY=v.y;
                    if(v.z<minZ)minZ=v.z; if(v.z>maxZ)maxZ=v.z;
                }
                if(!isFinite(minX)) return;
                const pad = 0.2;
                setCropSettings({ active:true, minX:minX-pad, maxX:maxX+pad, minY:minY-pad, maxY:maxY+pad, minZ:minZ-pad, maxZ:maxZ+pad });
                setActiveTab(null);
            };

            const doExportXYZ = () => {
                let s = "";
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3();
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    s += `${v.x.toFixed(4)} ${v.y.toFixed(4)} ${v.z.toFixed(4)}\n`;
                }
                const b = new Blob([s], {type:'text/plain'});
                const u = URL.createObjectURL(b);
                const a = document.createElement('a'); a.href=u; a.download='processed.xyz'; a.click();
            };

            const doExportPCD = () => {
                const count = points.length / 3;
                let s = "# .PCD v0.7 - Point Cloud Data file format\n";
                s += "VERSION 0.7\nFIELDS x y z\nSIZE 4 4 4\nTYPE F F F\nCOUNT 1 1 1\n";
                s += `WIDTH ${count}\nHEIGHT 1\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS ${count}\nDATA ascii\n`;
                const m = new THREE.Matrix4();
                m.makeRotationFromEuler(new THREE.Euler(
                    THREE.MathUtils.degToRad(transforms.rotX), THREE.MathUtils.degToRad(transforms.rotY), THREE.MathUtils.degToRad(transforms.rotZ)
                ));
                m.setPosition(transforms.x, transforms.y, transforms.z);
                const v = new THREE.Vector3();
                for(let i=0; i<points.length; i+=3) {
                    v.set(points[i], points[i+1], points[i+2]).applyMatrix4(m);
                    s += `${v.x.toFixed(4)} ${v.y.toFixed(4)} ${v.z.toFixed(4)}\n`;
                }
                const b = new Blob([s], {type:'text/plain'});
                const u = URL.createObjectURL(b);
                const a = document.createElement('a'); a.href=u; a.download='processed.pcd'; a.click();
            };

            const tabLabel = {transform:'变换',filter:'滤波',crop:'裁减',map:'地图',file:'文件'};
            const stopCam = e => e.stopPropagation();

            return (
                <div className="w-full h-full relative font-sans">
                    <PointCloudViewer points={points} transforms={transforms} cropSettings={cropSettings} setCropSettings={setCropSettings} setBoundingBoxInfo={setInfo} mapData={mapData} mapSettings={mapSettings} />

                    <div className="absolute inset-0 z-10 pointer-events-none">
                        <div className="pointer-events-auto absolute top-3 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-gray-900/90 border border-gray-700 rounded-lg px-2 py-1.5 shadow-xl backdrop-blur" onMouseDown={stopCam} onWheel={stopCam}>
                            <span className="text-sm font-bold text-blue-400 px-2 whitespace-nowrap">CloudLab</span>
                            <span className="text-xs text-gray-400 font-mono hidden sm:inline">{info.count.toLocaleString()} pts</span>
                            <span className="w-px h-5 bg-gray-700"></span>
                            {['transform','filter','crop','map','file'].map(t => (
                                <button key={t} onClick={()=>toggleTab(t)} className={`px-3 py-1.5 rounded text-sm font-medium ${activeTab===t?'bg-blue-600 text-white':'text-gray-300 hover:bg-gray-800'}`}>
                                    {tabLabel[t]}
                                </button>
                            ))}
                            {activeTab && <button onClick={()=>setActiveTab(null)} className="px-2 py-1 text-gray-400 hover:text-white text-sm" title="关闭">×</button>}
                        </div>

                        {activeTab && (
                            <div className="pointer-events-auto ui-float absolute top-14 left-1/2 -translate-x-1/2 w-[420px] max-w-[calc(100vw-24px)] bg-gray-900/95 border border-gray-700 rounded-xl p-3 space-y-3 shadow-2xl backdrop-blur" onMouseDown={stopCam} onWheel={stopCam}>
                                {activeTab==='transform' && (
                                    <div className="space-y-3">
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700">
                                            <div className="flex justify-between mb-2 text-sm font-bold text-gray-300"><span>平移 (m)</span> <button onClick={()=>setTransforms({...transforms,x:0,y:0,z:0})} className="text-blue-400 text-xs font-normal">重置</button></div>
                                            {['x','y','z'].map(k=>(<div key={k} className="flex items-center mb-2"><span className="w-6 uppercase text-xs text-gray-500 font-bold">{k}</span><input type="range" min="-50" max="50" step="0.01" value={transforms[k]} onChange={e=>setTransforms({...transforms,[k]:parseFloat(e.target.value)})} className="flex-1 mx-2"/><input type="number" step="0.01" value={transforms[k]} onChange={e=>setTransforms({...transforms,[k]:parseFloat(e.target.value)})} className="w-16 bg-gray-900 border border-gray-600 rounded px-1 py-0.5 text-xs text-right font-mono" /></div>))}
                                        </div>
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700">
                                            <div className="flex justify-between mb-2 text-sm font-bold text-gray-300"><span>旋转 (Deg)</span> <button onClick={()=>setTransforms({...transforms,rotX:0,rotY:0,rotZ:0})} className="text-blue-400 text-xs font-normal">重置</button></div>
                                            {['rotX','rotY','rotZ'].map((k,i)=>(<div key={k} className="flex items-center mb-2"><span className="w-6 uppercase text-xs text-gray-500 font-bold">{['X','Y','Z'][i]}</span><input type="range" min="-180" max="180" step="0.01" value={transforms[k]} onChange={e=>setTransforms({...transforms,[k]:parseFloat(e.target.value)})} className="flex-1 mx-2"/><input type="number" step="0.01" value={transforms[k]} onChange={e=>setTransforms({...transforms,[k]:parseFloat(e.target.value)})} className="w-16 bg-gray-900 border border-gray-600 rounded px-1 py-0.5 text-xs text-right font-mono" /></div>))}
                                        </div>
                                    </div>
                                )}

                                {activeTab==='filter' && (
                                    <div className="bg-gray-800 p-3 rounded-lg border border-gray-700">
                                        <h3 className="font-bold mb-3 text-sm">体素滤波</h3>
                                        <div className="flex justify-between text-xs mb-1 text-gray-400"><span>Leaf Size</span> <span className="text-blue-400 font-mono">{voxelLeaf}m</span></div>
                                        <input type="range" min="0.05" max="2.0" step="0.05" value={voxelLeaf} onChange={e=>setVoxelLeaf(parseFloat(e.target.value))} />
                                        <button onClick={doFilter} disabled={filtering} className="w-full mt-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-bold flex justify-center items-center">
                                            {filtering && <div className="spinner mr-2"></div>} {filtering?'处理中...':'应用滤波'}
                                        </button>
                                    </div>
                                )}

                                {activeTab==='crop' && (
                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center bg-gray-800 p-3 rounded-lg border border-gray-700 cursor-pointer" onClick={()=>{
                                            const on = !cropSettings.active;
                                            setCropSettings({...cropSettings, active:on});
                                            if (on) setActiveTab(null);
                                        }}>
                                            <span className="text-sm font-bold">显示裁减框</span>
                                            <div className={`w-10 h-5 rounded-full relative ${cropSettings.active?'bg-blue-600':'bg-gray-600'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full ${cropSettings.active?'left-6':'left-1'}`}/></div>
                                        </div>
                                        <p className="text-xs text-gray-400 leading-relaxed">打开后窗口会收起。在画面里<strong className="text-red-400">拖彩色面缩放</strong>，拖半透明内部平移 XY，Shift+拖内部改高度。空白处仍转视角。</p>
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700 text-xs font-mono text-gray-300 space-y-1">
                                            <div>X {cropSettings.minX.toFixed(2)} ~ {cropSettings.maxX.toFixed(2)}</div>
                                            <div>Y {cropSettings.minY.toFixed(2)} ~ {cropSettings.maxY.toFixed(2)}</div>
                                            <div>Z {cropSettings.minZ.toFixed(2)} ~ {cropSettings.maxZ.toFixed(2)}</div>
                                        </div>
                                        <button onClick={fitCropToCloud} className="w-full py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm font-bold">框住点云</button>
                                        <button onClick={doCrop} disabled={!cropSettings.active} className="w-full py-2 bg-red-600 hover:bg-red-500 disabled:bg-gray-700 disabled:text-gray-500 rounded text-sm font-bold">执行裁减</button>
                                    </div>
                                )}

                                {activeTab==='map' && (
                                    <div className="space-y-3">
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700 space-y-2">
                                            <div className="text-sm font-bold">加载地图</div>
                                            <p className="text-xs text-gray-500">先 YAML 填 origin，再 PGM。墙橙色。</p>
                                            <label className="block">
                                                <span className="inline-block py-1.5 px-3 bg-gray-700 hover:bg-gray-600 rounded text-sm cursor-pointer">选择 YAML</span>
                                                <input type="file" accept=".yaml,.yml" onChange={handleYaml} className="hidden"/>
                                                <div className="mt-1 text-xs text-blue-300 break-all">{pickedYaml || '未选择 lab3.yaml'}</div>
                                            </label>
                                            <label className="block">
                                                <span className="inline-block py-1.5 px-3 bg-gray-700 hover:bg-gray-600 rounded text-sm cursor-pointer">选择 PGM</span>
                                                <input type="file" accept=".pgm" onChange={handlePgm} className="hidden"/>
                                                <div className="mt-1 text-xs text-blue-300 break-all">{pickedPgm || '未选择 lab3.pgm'}</div>
                                            </label>
                                        </div>
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700 space-y-2">
                                            <div className="flex justify-between items-center cursor-pointer" onClick={()=>setMapSettings({...mapSettings,visible:!mapSettings.visible})}><span className="text-sm font-bold">地图可见性</span><div className={`w-10 h-5 rounded-full relative ${mapSettings.visible?'bg-green-500':'bg-gray-600'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full ${mapSettings.visible?'left-6':'left-1'}`}/></div></div>
                                            <div className="flex gap-2">
                                                <div className="flex-1"><span className="text-xs text-gray-500 block mb-1">Origin X</span><input type="number" step="0.01" value={mapSettings.originX} onChange={e=>setMapSettings({...mapSettings,originX:parseFloat(e.target.value)})} className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-sm text-blue-400 outline-none"/></div>
                                                <div className="flex-1"><span className="text-xs text-gray-500 block mb-1">Origin Y</span><input type="number" step="0.01" value={mapSettings.originY} onChange={e=>setMapSettings({...mapSettings,originY:parseFloat(e.target.value)})} className="w-full bg-gray-900 border border-gray-600 rounded p-1.5 text-sm text-blue-400 outline-none"/></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div><div className="flex justify-between text-xs text-gray-400 mb-1"><span>分辨率</span><span className="text-blue-400">{mapSettings.resolution}</span></div><input type="range" min="0.01" max="0.2" step="0.001" value={mapSettings.resolution} onChange={e=>setMapSettings({...mapSettings,resolution:parseFloat(e.target.value)})}/></div>
                                                <div><div className="flex justify-between text-xs text-gray-400 mb-1"><span>不透明度</span><span className="text-blue-400">{mapSettings.opacity}</span></div><input type="range" min="0" max="1" step="0.1" value={mapSettings.opacity} onChange={e=>setMapSettings({...mapSettings,opacity:parseFloat(e.target.value)})}/></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div><div className="text-xs text-gray-400 mb-1">旋转 (Deg)</div>
                                                <div className="flex items-center"><input type="range" min="0" max="360" step="0.01" value={mapSettings.rotation} onChange={e=>setMapSettings({...mapSettings,rotation:parseFloat(e.target.value)})} className="flex-1 mr-2"/>
                                                <input type="number" step="0.01" value={mapSettings.rotation} onChange={e=>setMapSettings({...mapSettings,rotation:parseFloat(e.target.value)})} className="w-14 bg-gray-900 border border-gray-600 rounded px-1 py-0.5 text-xs text-right font-mono" /></div></div>
                                                <div><div className="text-xs text-gray-400 mb-1">Z 偏移</div>
                                                <div className="flex items-center"><input type="range" min="-2" max="2" step="0.01" value={mapSettings.zOffset} onChange={e=>setMapSettings({...mapSettings,zOffset:parseFloat(e.target.value)})} className="flex-1 mr-2"/>
                                                <input type="number" step="0.01" value={mapSettings.zOffset} onChange={e=>setMapSettings({...mapSettings,zOffset:parseFloat(e.target.value)})} className="w-14 bg-gray-900 border border-gray-600 rounded px-1 py-0.5 text-xs text-right font-mono" /></div></div>
                                            </div>
                                            <div onClick={()=>setMapSettings({...mapSettings,flipY:!mapSettings.flipY})} className={`w-full py-1.5 text-center rounded cursor-pointer text-xs ${mapSettings.flipY?'bg-gray-700 text-green-400':'bg-gray-900 text-gray-500'}`}>{mapSettings.flipY ? '已翻转 Flip Y' : '未翻转 Flip Y'}</div>
                                            <button onClick={doExportMap} disabled={!mapData} className="w-full py-2 bg-orange-600 hover:bg-orange-500 disabled:bg-gray-700 disabled:text-gray-500 rounded text-sm font-bold">导出旋转后的地图 (.pgm)</button>
                                        </div>
                                    </div>
                                )}

                                {activeTab==='file' && (
                                    <div className="space-y-2">
                                        <div className="bg-gray-800 p-3 rounded-lg border border-gray-700">
                                            <div className="text-sm font-bold mb-1">导入点云</div>
                                            <p className="text-xs text-gray-500 mb-2">ascii / binary / binary_compressed</p>
                                            <label className="block">
                                                <span className="inline-block py-1.5 px-3 bg-gray-700 hover:bg-gray-600 rounded text-sm cursor-pointer">选择点云</span>
                                                <input type="file" accept=".pcd,.xyz,.txt" onChange={handleFile} className="hidden"/>
                                                <div className="mt-1 text-xs text-blue-300 break-all">{pickedPcd || '未选择 lab3.pcd'}</div>
                                            </label>
                                        </div>
                                        <button onClick={doExportPCD} className="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-bold">导出 .PCD</button>
                                        <button onClick={doExportXYZ} className="w-full py-2 bg-green-600 hover:bg-green-500 rounded text-sm font-bold">导出 .XYZ</button>
                                        <button onClick={()=>{setPoints(generateDemoData());setTransforms({x:0,y:0,z:0,rotX:0,rotY:0,rotZ:0}); setPickedPcd('');}} className="w-full py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm">重置示例</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {cropSettings.active && (
                            <div className="pointer-events-auto absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-gray-900/90 border border-red-700/70 rounded-lg px-3 py-2 text-xs shadow-xl" onMouseDown={stopCam} onWheel={stopCam}>
                                <span className="text-red-400 font-bold whitespace-nowrap">裁减框</span>
                                <span className="font-mono text-gray-300 hidden sm:inline">X {cropSettings.minX.toFixed(1)}~{cropSettings.maxX.toFixed(1)}</span>
                                <span className="font-mono text-gray-300 hidden sm:inline">Y {cropSettings.minY.toFixed(1)}~{cropSettings.maxY.toFixed(1)}</span>
                                <span className="font-mono text-gray-300 hidden sm:inline">Z {cropSettings.minZ.toFixed(1)}~{cropSettings.maxZ.toFixed(1)}</span>
                                <button onClick={doCrop} className="px-2 py-1 bg-red-600 hover:bg-red-500 rounded font-bold">执行</button>
                                <button onClick={()=>setCropSettings({...cropSettings,active:false})} className="text-gray-400 hover:text-white">关闭</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
